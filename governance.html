<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClinLoop Rule Sign-off</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f1f5f9; --surface: #ffffff; --border: #e2e8f0; --border-strong: #cbd5e1;
  --text: #0f172a; --muted: #475569; --dim: #64748b;
  --accent: #0284c7; --accent-soft: rgba(2,132,199,.10);
  --critical: #be123c; --critical-soft: rgba(225,29,72,.10);
  --high: #c2410c; --high-soft: rgba(234,88,12,.10);
  --moderate: #a16207; --moderate-soft: rgba(202,138,4,.12);
  --low: #475569; --low-soft: rgba(71,85,105,.10);
  --ok: #047857; --ok-soft: rgba(5,150,105,.10);
  --radius: 12px; --shadow: 0 4px 14px rgba(15,23,42,.06);
  --font-head: 'Outfit', 'Noto Sans KR', system-ui, sans-serif;
  --font-body: 'Plus Jakarta Sans', 'Noto Sans KR', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #060b16; --surface: #0d1526; --border: rgba(255,255,255,.08); --border-strong: rgba(255,255,255,.16);
    --text: #f1f5f9; --muted: #a3b1c6; --dim: #7c8aa0;
    --accent: #38bdf8; --accent-soft: rgba(56,189,248,.12);
    --critical: #fb7185; --critical-soft: rgba(251,113,133,.14);
    --high: #fb923c; --high-soft: rgba(251,146,60,.14);
    --moderate: #facc15; --moderate-soft: rgba(250,204,21,.12);
    --low: #94a3b8; --low-soft: rgba(148,163,184,.12);
    --ok: #34d399; --ok-soft: rgba(52,211,153,.12);
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #060b16; --surface: #0d1526; --border: rgba(255,255,255,.08); --border-strong: rgba(255,255,255,.16);
  --text: #f1f5f9; --muted: #a3b1c6; --dim: #7c8aa0;
  --accent: #38bdf8; --accent-soft: rgba(56,189,248,.12);
  --critical: #fb7185; --critical-soft: rgba(251,113,133,.14);
  --high: #fb923c; --high-soft: rgba(251,146,60,.14);
  --moderate: #facc15; --moderate-soft: rgba(250,204,21,.12);
  --low: #94a3b8; --low-soft: rgba(148,163,184,.12);
  --ok: #34d399; --ok-soft: rgba(52,211,153,.12);
  --shadow: none;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 var(--font-body); }
.wrap { max-width: 1120px; margin: 0 auto; padding: 20px 16px 64px; }
header { display: flex; flex-wrap: wrap; gap: 12px; align-items: baseline; justify-content: space-between; }
header nav { display: flex; gap: 12px; align-items: center; }
h1 { font: 800 1.6rem/1.2 var(--font-head); margin: 0; letter-spacing: -.01em; }
h1 span { color: var(--accent); }
.sub { color: var(--muted); margin: 4px 0 0; }
a { color: var(--accent); font-weight: 600; }
.banner { margin: 16px 0; padding: 10px 14px; border-radius: var(--radius); background: var(--moderate-soft);
  border: 1px solid var(--border); font-size: .9rem; }
.feed { margin: 0 0 16px; padding: 10px 14px; border-radius: var(--radius); font-size: .9rem; font-weight: 600;
  border: 1px solid var(--border); }
.feed.ok { background: var(--ok-soft); color: var(--ok); font-weight: 500; }
.feed.alarm { background: var(--critical); color: #fff; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
.connect { display: grid; grid-template-columns: 1fr 1.4fr auto; gap: 10px; padding: 14px; align-items: end; }
label { display: block; font-size: .78rem; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
input, select, textarea { width: 100%; font: inherit; color: var(--text); background: var(--bg);
  border: 1px solid var(--border-strong); border-radius: 8px; padding: 8px 10px; }
textarea { min-height: 72px; resize: vertical; }
button { font: 600 .88rem var(--font-body); border-radius: 8px; padding: 8px 14px; cursor: pointer;
  border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.danger { color: var(--critical); }
button:disabled { opacity: .5; cursor: not-allowed; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible, a:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px; }
.status-line { padding: 0 14px 12px; font-size: .85rem; color: var(--muted); min-height: 1.4em; }
.status-line.error { color: var(--critical); }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 16px 0; }
.kpi { padding: 12px 14px; }
.kpi .v { font: 700 1.6rem/1.1 var(--font-head); font-variant-numeric: tabular-nums; }
.kpi .l { font-size: .8rem; color: var(--muted); }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0 12px; }
.toolbar .spacer { flex: 1; }
.check { display: flex; gap: 6px; align-items: center; margin: 0; color: var(--text); font-weight: 500; font-size: .88rem; }
.check input { width: auto; }
.loop { padding: 14px; margin-bottom: 10px; border-left: 4px solid var(--low); }
.loop.critical { border-left-color: var(--critical); }
.loop.high { border-left-color: var(--high); }
.loop.moderate { border-left-color: var(--moderate); }
.loop-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.loop-title { font-weight: 700; flex: 1 1 260px; }
.chip { font: 600 .72rem var(--font-mono); padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.chip.critical { background: var(--critical-soft); color: var(--critical); }
.chip.high { background: var(--high-soft); color: var(--high); }
.chip.moderate { background: var(--moderate-soft); color: var(--moderate); }
.chip.low, .chip.neutral { background: var(--low-soft); color: var(--low); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.overdue { background: var(--critical); color: #fff; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--muted); font-size: .85rem; margin: 6px 0; }
.meta b { color: var(--text); font-weight: 600; }
.missing { font-weight: 600; margin: 4px 0; }
.action { color: var(--muted); font-size: .9rem; }
details { margin-top: 8px; }
summary { cursor: pointer; color: var(--accent); font-size: .85rem; font-weight: 600; }
.evidence { font: .78rem/1.5 var(--font-mono); color: var(--muted); background: var(--bg); padding: 10px; margin-top: 6px;
  border-radius: 8px; overflow-x: auto; white-space: pre-wrap; word-break: break-word; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.form { display: none; gap: 8px; margin-top: 10px; padding: 12px; border-radius: 8px; background: var(--bg); }
.form.open { display: grid; }
.form .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.msg { border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-top: 8px; background: var(--surface); }
.msg-text { white-space: pre-wrap; margin: 6px 0; }
.empty { text-align: center; color: var(--muted); padding: 40px 16px; }
.rate-table { width: 100%; border-collapse: collapse; font-size: .88rem; }
.rate-table th, .rate-table td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
.rate-table td.num, .rate-table th.num { font-variant-numeric: tabular-nums; text-align: right; }
footer { margin-top: 32px; color: var(--dim); font-size: .8rem; }
@media (max-width: 720px) {
  .connect { grid-template-columns: 1fr; }
  .kpis { grid-template-columns: repeat(2, 1fr); }
  .form .row { grid-template-columns: 1fr; }
}
</style>
<style>
.gov-kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 16px 0; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0 12px; }
.filters select, .filters input { width: auto; }
.rule { padding: 14px; margin-bottom: 10px; border-left: 4px solid var(--low); }
.rule.approved { border-left-color: var(--ok); }
.rule.rejected, .rule.changes_requested { border-left-color: var(--critical); }
.rule.stale { border-left-color: var(--moderate); }
.def { display: grid; grid-template-columns: 160px 1fr; gap: 4px 12px; font-size: .88rem; margin: 8px 0; }
.def dt { color: var(--muted); font-weight: 600; }
.def dd { margin: 0; overflow-wrap: anywhere; }
.mono { font-family: var(--font-mono); font-size: .8rem; }
.reviews { margin: 8px 0 0; padding: 0; list-style: none; font-size: .85rem; color: var(--muted); }
.reviews li { padding: 4px 0; border-top: 1px solid var(--border); }
.crit-table { width: 100%; border-collapse: collapse; font-size: .86rem; }
.crit-table th, .crit-table td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
.crit-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
.table-wrap { overflow-x: auto; }
@media (max-width: 720px) { .gov-kpis { grid-template-columns: repeat(2, 1fr); } .def { grid-template-columns: 1fr; } }
</style>
<script src="config.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>ClinLoop <span data-i18n="title"></span></h1>
      <p class="sub" data-i18n="subtitle"></p>
    </div>
    <nav>
      <button type="button" id="btn-lang" aria-label="Language">English</button>
      <a href="worklist.html" data-i18n="worklist"></a>
    </nav>
  </header>

  <div class="banner" role="note" data-i18n="explain"></div>

  <section class="card" aria-label="Connection">
    <form class="connect" id="connect-form">
      <div>
        <label for="api-base" data-i18n="api"></label>
        <input id="api-base" type="url" placeholder="http://localhost:8124" required>
      </div>
      <div>
        <label for="token" data-i18n="token"></label>
        <input id="token" type="password" autocomplete="off">
      </div>
      <button class="primary" type="submit" data-i18n="load"></button>
    </form>
    <div class="status-line" id="status" aria-live="polite"></div>
  </section>

  <div id="app" hidden>
    <section class="gov-kpis" aria-label="Summary">
      <div class="card kpi"><div class="v" id="k-approved">–</div><div class="l" data-i18n="kApproved"></div></div>
      <div class="card kpi"><div class="v" id="k-pending">–</div><div class="l" data-i18n="kPending"></div></div>
      <div class="card kpi"><div class="v" id="k-blocked">–</div><div class="l" data-i18n="kBlocked"></div></div>
      <div class="card kpi"><div class="v" id="k-critical" style="font-size:1.1rem;">–</div><div class="l" data-i18n="kCritical"></div></div>
    </section>
    <div id="policy" class="feed" role="status"></div>

    <section class="card" style="padding:14px;margin-bottom:16px;" aria-labelledby="crit-h">
      <div class="loop-head">
        <strong id="crit-h" class="loop-title" data-i18n="critTitle"></strong>
        <span id="crit-chip" class="chip neutral"></span>
      </div>
      <p class="sub" style="font-size:.85rem;" id="crit-basis"></p>
      <p class="sub" style="font-size:.85rem;" id="crit-approval"></p>
      <div class="table-wrap"><table class="crit-table" id="crit-table"></table></div>
      <form class="form" id="crit-form" style="margin-top:12px;">
        <p class="sub" style="margin:0;font-size:.85rem;" data-i18n="critHelp"></p>
        <div class="row">
          <div><label for="crit-title" data-i18n="approverTitle"></label><input id="crit-title" name="title" required></div>
          <div><label for="crit-note" data-i18n="note"></label><input id="crit-note" name="note"></div>
        </div>
        <div><button class="primary" type="submit" data-i18n="approveList"></button></div>
      </form>
    </section>

    <div class="filters">
      <label class="check" for="f-status" data-i18n="fStatus"></label>
      <select id="f-status">
        <option value="" data-i18n="all"></option>
        <option value="pending"></option><option value="stale"></option><option value="changes_requested"></option>
        <option value="rejected"></option><option value="approved"></option>
      </select>
      <label class="check" for="f-domain" data-i18n="fDomain"></label>
      <select id="f-domain"><option value="" data-i18n="all"></option></select>
      <input id="f-text" type="search" aria-label="Search rules">
    </div>
    <section id="rules" aria-label="Rules"></section>
  </div>

  <footer data-i18n="footer"></footer>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const RANK = { viewer: 0, navigator: 1, clinician: 2, admin: 3 };
  const T = {
    ko: {
      title: '규칙 승인', subtitle: '전문의가 각 규칙을 검토·승인하고, 병원이 위급 소견 목록을 승인합니다.',
      worklist: '작업 목록 →', api: 'ClinLoop API', token: '접근 토큰 (검토 시 필요)', load: '불러오기',
      explain: '승인은 규칙의 현재 버전(지문)에 묶입니다. 규칙이나 판독 로직이 바뀌면 승인은 "재검토 필요"가 되고 다시 검토해야 합니다. 모든 결정은 해시 체인 감사 기록에 남습니다. ClinLoop은 승인 과정을 기록할 뿐, 전문의의 검토를 대신하지 않습니다.',
      kApproved: '승인된 규칙', kPending: '검토 대기·재검토', kBlocked: '반려·수정 요청', kCritical: '위급 소견 목록',
      policy: (s) => `승인 요건: 서로 다른 검토자 ${s.approvals_required}명 · ` + (s.enforce_signoff
        ? '섀도 모드 사용 중: 승인되지 않은 규칙의 루프는 작업 목록에 표시되지 않고 에스컬레이션되지 않습니다.'
        : '섀도 모드 꺼짐: 모든 규칙의 루프가 표시됩니다(파일럿). 운영 시 CLINLOOP_ENFORCE_SIGNOFF=1을 설정하세요.'),
      critTitle: '위급 소견 목록 (ACR 소통 지침)', critHelp: '이 버전의 목록 전체를 승인합니다. 목록 파일이 바뀌면 승인은 무효가 됩니다.',
      approverTitle: '승인자 직함 (예: 영상의학과 과장)', note: '메모', approveList: '이 목록 승인',
      critStatus: { approved: '승인됨', not_approved: '미승인', changed_since_approval: '승인 후 변경됨' },
      critCols: ['소견', '분류', '보고 기한', '패턴'], category: (c) => `ACR ${c}등급`, minutes: (m) => `${m}분`,
      approvedBy: (a) => `승인: ${a.approver} (${a.title}) · ${a.decided_at.slice(0, 16)}`, notApproved: '아직 이 병원에서 승인하지 않았습니다.',
      custom: '병원 맞춤 목록', defaultList: '기본 예시 목록',
      fStatus: '상태', fDomain: '분야', all: '전체', search: '규칙 검색',
      status: { pending: '검토 대기', stale: '재검토 필요', changes_requested: '수정 요청', rejected: '반려', approved: '승인' },
      dTrigger: '트리거', dFollow: '필요한 후속 조치', dDeadline: '기본 기한', dLogic: '시간 논리', dNote: '근거 메모', dRefs: '참고문헌', dFp: '지문',
      any: '중 하나', all2: '모두', approvals: (n, r) => `승인 ${n}/${r}`,
      decision: '결정', specialty: '전문 분야 (예: 영상의학과 흉부)', reviewNote: '검토 의견 (반려·수정 요청 시 필수)', submit: '결정 기록',
      decisions: { approve: '승인', request_changes: '수정 요청', reject: '반려' },
      signInToReview: '검토하려면 의료진 토큰으로 불러오세요.', recorded: (id, s) => `${id}: 기록되었습니다 (${s}).`,
      listApproved: '위급 소견 목록을 승인했습니다.', loadFailed: (e) => `불러오지 못했습니다: ${e}`, loaded: (u) => u ? `${u.user}(${u.role})님으로 로그인했습니다.` : '읽기 전용으로 불러왔습니다.',
      noRules: '조건에 맞는 규칙이 없습니다.',
      footer: 'ClinLoop AI · 전문의가 승인하기 전까지 어떤 규칙도 진료에 사용해서는 안 됩니다.',
    },
    en: {
      title: 'Rule sign-off', subtitle: 'Specialists review and approve each rule; the hospital approves its critical-finding list.',
      worklist: 'Worklist →', api: 'ClinLoop API', token: 'Access token (needed to review)', load: 'Load',
      explain: 'A sign-off is bound to the current version (fingerprint) of a rule. If the rule or the report-reading logic changes, the sign-off becomes "needs re-review". Every decision goes into the hash-chained audit log. ClinLoop records the review; it does not replace it.',
      kApproved: 'Rules approved', kPending: 'Pending or re-review', kBlocked: 'Rejected or changes requested', kCritical: 'Critical-finding list',
      policy: (s) => `Approval policy: ${s.approvals_required} distinct reviewer(s) · ` + (s.enforce_signoff
        ? 'Shadow mode ON: loops from rules that are not approved are kept off the worklist and never escalated.'
        : 'Shadow mode OFF: loops from every rule are shown (pilot). Set CLINLOOP_ENFORCE_SIGNOFF=1 for clinical use.'),
      critTitle: 'Critical-finding list (ACR communication)', critHelp: 'You approve this version of the whole list. Any change to the list file voids the approval.',
      approverTitle: 'Approver title (e.g. Chair, Department of Radiology)', note: 'Note', approveList: 'Approve this list',
      critStatus: { approved: 'approved', not_approved: 'not approved', changed_since_approval: 'changed since approval' },
      critCols: ['Finding', 'Category', 'Report within', 'Patterns'], category: (c) => `ACR category ${c}`, minutes: (m) => `${m} min`,
      approvedBy: (a) => `Approved by ${a.approver} (${a.title}) · ${a.decided_at.slice(0, 16)}`, notApproved: 'Not yet approved by this hospital.',
      custom: 'Hospital list', defaultList: 'Default example list',
      fStatus: 'Status', fDomain: 'Domain', all: 'All', search: 'Search rules',
      status: { pending: 'pending', stale: 'needs re-review', changes_requested: 'changes requested', rejected: 'rejected', approved: 'approved' },
      dTrigger: 'Trigger', dFollow: 'Required follow-up', dDeadline: 'Default window', dLogic: 'Temporal logic', dNote: 'Evidence note', dRefs: 'References', dFp: 'Fingerprint',
      any: 'any of', all2: 'all of', approvals: (n, r) => `${n}/${r} approvals`,
      decision: 'Decision', specialty: 'Specialty (e.g. Thoracic radiology)', reviewNote: 'Review note (required to reject or request changes)', submit: 'Record decision',
      decisions: { approve: 'Approve', request_changes: 'Request changes', reject: 'Reject' },
      signInToReview: 'Load with a clinician token to review.', recorded: (id, s) => `${id}: recorded (${s}).`,
      listApproved: 'Critical-finding list approved.', loadFailed: (e) => `Could not load: ${e}`, loaded: (u) => u ? `Signed in as ${u.user} (${u.role}).` : 'Loaded read-only.',
      noRules: 'No rules match.',
      footer: 'ClinLoop AI · No rule should be used for patient care until a specialist has signed it off.',
    },
  };
  const store = {
    get(k, s = sessionStorage) { try { return s.getItem(k) || ''; } catch { return ''; } },
    set(k, v, s = sessionStorage) { try { s.setItem(k, v); } catch {} },
  };
  let lang = store.get('clinloop_lang', localStorage) || ((navigator.language || '').startsWith('ko') ? 'ko' : 'en');
  const t = () => T[lang];
  const state = { base: '', token: '', user: null, rules: [], critical: null, summary: null };
  const isLocal = ['localhost', '127.0.0.1'].includes(location.hostname);
  $('api-base').value = store.get('clinloop_api') || window.CLINLOOP_API_BASE || (isLocal ? 'http://localhost:8124' : '');
  $('token').value = store.get('clinloop_token');
  const can = (role) => state.user && RANK[state.user.role] >= RANK[role];

  function setStatus(msg, isError = false) { $('status').textContent = msg; $('status').classList.toggle('error', isError); }

  async function api(path, opts = {}) {
    const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
    if (state.token) headers.Authorization = `Bearer ${state.token}`;
    const res = await fetch(state.base + path, { ...opts, headers });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.detail || `HTTP ${res.status}`);
    return body;
  }

  function applyLang() {
    document.documentElement.lang = lang;
    $('btn-lang').textContent = lang === 'ko' ? 'English' : '한국어';
    document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t()[el.dataset.i18n]; });
    document.querySelectorAll('#f-status option[value]').forEach((o) => { if (o.value) o.textContent = t().status[o.value]; });
    $('f-text').placeholder = t().search;
    $('token').placeholder = lang === 'ko' ? '의료진 Bearer 토큰' : 'Clinician bearer token';
    if (state.summary) render();
  }

  function statusChip(s) {
    const cls = { approved: 'ok', rejected: 'critical', changes_requested: 'critical', stale: 'moderate' }[s] || 'neutral';
    return `<span class="chip ${cls}">${esc(t().status[s] || s)}</span>`;
  }

  function renderCritical() {
    const c = state.critical;
    const cls = { approved: 'ok', changed_since_approval: 'critical' }[c.status] || 'moderate';
    $('crit-chip').className = `chip ${cls}`;
    $('crit-chip').textContent = t().critStatus[c.status];
    $('crit-basis').textContent = `${c.custom_list ? t().custom : t().defaultList}: ${c.name || ''} — ${c.basis || ''}`;
    $('crit-approval').textContent = c.approval && c.status === 'approved' ? t().approvedBy(c.approval) : t().notApproved;
    const [c1, c2, c3, c4] = t().critCols;
    $('crit-table').innerHTML = `<thead><tr><th>${esc(c1)}</th><th>${esc(c2)}</th><th class="num">${esc(c3)}</th><th>${esc(c4)}</th></tr></thead>
      <tbody>${c.findings.map((f) => `<tr><td>${esc((f.label || {})[lang] || (f.label || {}).en || f.id)}</td>
        <td>${esc(t().category(f.category))}</td><td class="num">${esc(t().minutes(f.window_minutes))}</td>
        <td class="mono">${esc(f.patterns.join(' | '))}</td></tr>`).join('')}</tbody>`;
    $('crit-form').classList.toggle('open', can('clinician') && c.status !== 'approved');
  }

  function ruleCard(r) {
    const name = lang === 'ko' ? r.name_ko : r.name;
    const reviews = (r.reviews || []).slice().reverse().map((v) =>
      `<li>${esc(v.decided_at.slice(0, 16))} · <b>${esc(v.reviewer)}</b> (${esc(v.specialty)}) · ${esc(t().decisions[v.decision] || v.decision)}${v.note ? ' — ' + esc(v.note) : ''}${v.rule_hash !== r.fingerprint ? ' · <i>' + esc(t().status.stale) + '</i>' : ''}</li>`).join('');
    return `
    <article class="card rule ${esc(r.status)}" data-rule="${esc(r.rule_id)}">
      <div class="loop-head">
        <span class="loop-title">${esc(r.rule_id)} · ${esc(name)}</span>
        <span class="chip ${esc(r.severity)}">${esc(r.severity)}</span>
        ${statusChip(r.status)}
        <span class="chip neutral">${esc(t().approvals(r.approvals, r.approvals_required))}</span>
      </div>
      <dl class="def">
        <dt>${esc(t().dTrigger)}</dt><dd>${esc(r.description)}</dd>
        <dt>${esc(t().dFollow)}</dt><dd>${esc((r.followup_logic === 'any' ? t().any : t().all2) + ': ' + r.required_followups.join(', '))}</dd>
        <dt>${esc(t().dDeadline)}</dt><dd>${esc(r.deadline)}</dd>
        <dt>${esc(t().dLogic)}</dt><dd class="mono">${esc(r.ltl_formula)}</dd>
        ${r.evidence_note ? `<dt>${esc(t().dNote)}</dt><dd>${esc(r.evidence_note)}</dd>` : ''}
        <dt>${esc(t().dRefs)}</dt><dd>${esc((r.references || []).join('; '))}</dd>
        <dt>${esc(t().dFp)}</dt><dd class="mono">${esc(r.fingerprint.slice(0, 16))}…</dd>
      </dl>
      ${reviews ? `<ul class="reviews">${reviews}</ul>` : ''}
      ${can('clinician') ? `
      <form class="form open" data-review="${esc(r.rule_id)}" style="margin-top:10px;">
        <div class="row">
          <div><label>${esc(t().decision)}<select name="decision">
            ${Object.entries(t().decisions).map(([k, v]) => `<option value="${k}">${esc(v)}</option>`).join('')}</select></label></div>
          <div><label>${esc(t().specialty)}<input name="specialty" required></label></div>
        </div>
        <div><label>${esc(t().reviewNote)}<textarea name="note"></textarea></label></div>
        <div><button class="primary" type="submit">${esc(t().submit)}</button></div>
      </form>` : ''}
    </article>`;
  }

  function render() {
    const s = state.summary;
    const by = s.by_status || {};
    $('k-approved').textContent = `${s.rules_approved}/${s.rules_total}`;
    $('k-pending').textContent = (by.pending || 0) + (by.stale || 0);
    $('k-blocked').textContent = (by.rejected || 0) + (by.changes_requested || 0);
    $('k-critical').textContent = t().critStatus[s.critical_findings_list];
    $('policy').className = `feed ${s.enforce_signoff ? 'ok' : 'alarm'}`;
    $('policy').textContent = t().policy(s);
    renderCritical();
    const st = $('f-status').value, dom = $('f-domain').value, q = $('f-text').value.trim().toLowerCase();
    const rows = state.rules.filter((r) => (!st || r.status === st) && (!dom || r.domain === dom)
      && (!q || `${r.rule_id} ${r.name} ${r.name_ko} ${r.description}`.toLowerCase().includes(q)));
    $('rules').innerHTML = (can('clinician') ? '' : `<p class="sub">${esc(t().signInToReview)}</p>`)
      + (rows.length ? rows.map(ruleCard).join('') : `<div class="card empty">${esc(t().noRules)}</div>`);
  }

  async function reload() {
    const [summary, rules, critical] = await Promise.all([
      api('/api/v1/governance/summary'), api('/api/v1/governance/rules'), api('/api/v1/governance/critical-findings')]);
    state.summary = summary; state.rules = rules.rules; state.critical = critical;
    const domains = [...new Set(state.rules.map((r) => r.domain))].sort();
    const current = $('f-domain').value;
    $('f-domain').innerHTML = `<option value="">${esc(t().all)}</option>` + domains.map((d) => `<option value="${esc(d)}">${esc(d.replace(/_/g, ' '))}</option>`).join('');
    $('f-domain').value = current;
    render();
  }

  $('btn-lang').addEventListener('click', () => { lang = lang === 'ko' ? 'en' : 'ko'; store.set('clinloop_lang', lang, localStorage); applyLang(); });
  ['f-status', 'f-domain'].forEach((id) => $(id).addEventListener('change', render));
  $('f-text').addEventListener('input', render);

  $('connect-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    state.base = $('api-base').value.replace(/\/+$/, '');
    state.token = $('token').value.trim();
    try {
      state.user = state.token ? await api('/api/v1/me') : null;
      store.set('clinloop_api', state.base);
      if (state.token) store.set('clinloop_token', state.token);
      await reload();
      $('app').hidden = false;
      setStatus(t().loaded(state.user));
    } catch (err) { setStatus(t().loadFailed(err.message), true); }
  });

  $('crit-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const data = new FormData(e.target);
    try {
      await api('/api/v1/governance/critical-findings/approve', { method: 'POST', body: JSON.stringify({
        title: data.get('title'), note: data.get('note') || '', content_hash: state.critical.content_hash }) });
      setStatus(t().listApproved);
      await reload();
    } catch (err) { setStatus(err.message, true); }
  });

  $('rules').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;
    const ruleId = form.dataset.review;
    const rule = state.rules.find((r) => r.rule_id === ruleId);
    const data = new FormData(form);
    try {
      const r = await api(`/api/v1/governance/rules/${encodeURIComponent(ruleId)}/review`, { method: 'POST', body: JSON.stringify({
        decision: data.get('decision'), specialty: data.get('specialty'), note: data.get('note') || '', fingerprint: rule.fingerprint }) });
      setStatus(t().recorded(ruleId, t().status[r.status] || r.status));
      await reload();
    } catch (err) { setStatus(err.message, true); }
  });

  applyLang();
})();
</script>
</body>
</html>
