<style>
:root {
  --bg: #f1f5f9; --surface: #ffffff; --border: #e2e8f0; --border-strong: #cbd5e1;
  --text: #0f172a; --muted: #475569; --dim: #556274;
  --accent: #0369a1; --accent-soft: rgba(3,105,161,.10);
  --critical: #be123c; --critical-soft: rgba(225,29,72,.10);
  --high: #c2410c; --high-soft: rgba(234,88,12,.10);
  --moderate: #854d0e; --moderate-soft: rgba(202,138,4,.12);
  --low: #475569; --low-soft: rgba(71,85,105,.10);
  --ok: #065f46; --ok-soft: rgba(5,150,105,.10);
  --radius: 12px; --shadow: 0 4px 14px rgba(15,23,42,.06);
  --font-head: 'Outfit', 'Noto Sans KR', system-ui, sans-serif;
  --font-body: 'Plus Jakarta Sans', 'Noto Sans KR', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #060b16; --surface: #0d1526; --border: rgba(255,255,255,.08); --border-strong: rgba(255,255,255,.16);
    --text: #f1f5f9; --muted: #a3b1c6; --dim: #7c8aa0;
    --accent: #38bdf8; --accent-soft: rgba(56,189,248,.12);
    --critical: #fb7185; --critical-soft: rgba(251,113,133,.14);
    --high: #fb923c; --high-soft: rgba(251,146,60,.14);
    --moderate: #facc15; --moderate-soft: rgba(250,204,21,.12);
    --low: #94a3b8; --low-soft: rgba(148,163,184,.12);
    --ok: #34d399; --ok-soft: rgba(52,211,153,.12);
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #060b16; --surface: #0d1526; --border: rgba(255,255,255,.08); --border-strong: rgba(255,255,255,.16);
  --text: #f1f5f9; --muted: #a3b1c6; --dim: #7c8aa0;
  --accent: #38bdf8; --accent-soft: rgba(56,189,248,.12);
  --critical: #fb7185; --critical-soft: rgba(251,113,133,.14);
  --high: #fb923c; --high-soft: rgba(251,146,60,.14);
  --moderate: #facc15; --moderate-soft: rgba(250,204,21,.12);
  --low: #94a3b8; --low-soft: rgba(148,163,184,.12);
  --ok: #34d399; --ok-soft: rgba(52,211,153,.12);
  --shadow: none;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 var(--font-body); }
.wrap { max-width: 1120px; margin: 0 auto; padding: 20px 16px 64px; }
header { display: flex; flex-wrap: wrap; gap: 12px; align-items: baseline; justify-content: space-between; }
header nav { display: flex; gap: 12px; align-items: center; }
h1 { font: 800 1.6rem/1.2 var(--font-head); margin: 0; letter-spacing: -.01em; }
h1 span { color: var(--accent); }
.sub { color: var(--muted); margin: 4px 0 0; }
a { color: var(--accent); font-weight: 600; }
.banner { margin: 16px 0; padding: 10px 14px; border-radius: var(--radius); background: var(--moderate-soft);
  border: 1px solid var(--border); font-size: .9rem; }
.feed { margin: 0 0 16px; padding: 10px 14px; border-radius: var(--radius); font-size: .9rem; font-weight: 600;
  border: 1px solid var(--border); }
.feed.ok { background: var(--ok-soft); color: var(--ok); font-weight: 500; }
.feed.alarm { background: var(--critical); color: #fff; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
.connect { display: grid; grid-template-columns: 1fr 1.4fr auto; gap: 10px; padding: 14px; align-items: end; }
label { display: block; font-size: .78rem; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
input, select, textarea { width: 100%; font: inherit; color: var(--text); background: var(--bg);
  border: 1px solid var(--border-strong); border-radius: 8px; padding: 8px 10px; }
textarea { min-height: 72px; resize: vertical; }
button { font: 600 .88rem var(--font-body); border-radius: 8px; padding: 8px 14px; cursor: pointer;
  border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.danger { color: var(--critical); }
button:disabled { opacity: .5; cursor: not-allowed; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible, a:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px; }
.status-line { padding: 0 14px 12px; font-size: .85rem; color: var(--muted); min-height: 1.4em; }
.status-line.error { color: var(--critical); }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 16px 0; }
.kpi { padding: 12px 14px; }
.kpi .v { font: 700 1.6rem/1.1 var(--font-head); font-variant-numeric: tabular-nums; }
.kpi .l { font-size: .8rem; color: var(--muted); }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0 12px; }
.toolbar .spacer { flex: 1; }
.check { display: flex; gap: 6px; align-items: center; margin: 0; color: var(--text); font-weight: 500; font-size: .88rem; }
.check input { width: auto; }
.loop { padding: 14px; margin-bottom: 10px; border-left: 4px solid var(--low); }
.loop.critical { border-left-color: var(--critical); }
.loop.high { border-left-color: var(--high); }
.loop.moderate { border-left-color: var(--moderate); }
.loop-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.loop-title { font-weight: 700; flex: 1 1 260px; }
.chip { font: 600 .72rem var(--font-mono); padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.chip.critical { background: var(--critical-soft); color: var(--critical); }
.chip.high { background: var(--high-soft); color: var(--high); }
.chip.moderate { background: var(--moderate-soft); color: var(--moderate); }
.chip.low, .chip.neutral { background: var(--low-soft); color: var(--low); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.overdue { background: var(--critical); color: #fff; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--muted); font-size: .85rem; margin: 6px 0; }
.meta b { color: var(--text); font-weight: 600; }
.missing { font-weight: 600; margin: 4px 0; }
.action { color: var(--muted); font-size: .9rem; }
details { margin-top: 8px; }
summary { cursor: pointer; color: var(--accent); font-size: .85rem; font-weight: 600; }
.evidence { font: .78rem/1.5 var(--font-mono); color: var(--muted); background: var(--bg); padding: 10px; margin-top: 6px;
  border-radius: 8px; overflow-x: auto; white-space: pre-wrap; word-break: break-word; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.form { display: none; gap: 8px; margin-top: 10px; padding: 12px; border-radius: 8px; background: var(--bg); }
.form.open { display: grid; }
.form .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.msg { border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-top: 8px; background: var(--surface); }
.msg-text { white-space: pre-wrap; margin: 6px 0; }
.empty { text-align: center; color: var(--muted); padding: 40px 16px; }
.rate-table { width: 100%; border-collapse: collapse; font-size: .88rem; }
.rate-table th, .rate-table td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
.rate-table td.num, .rate-table th.num { font-variant-numeric: tabular-nums; text-align: right; }
footer { margin-top: 32px; color: var(--dim); font-size: .8rem; }
@media (max-width: 720px) {
  .connect { grid-template-columns: 1fr; }
  .kpis { grid-template-columns: repeat(2, 1fr); }
  .form .row { grid-template-columns: 1fr; }
}
</style>
<style>
.pane { padding: 16px; margin-top: 16px; }
.pane h2 { font: 700 1.1rem var(--font-head); margin: 0 0 4px; }
.tbl { width: 100%; border-collapse: collapse; font-size: .86rem; }
.tbl th, .tbl td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; overflow-wrap: anywhere; }
.tbl td.num, .tbl th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.scroll { overflow-x: auto; }
.rate { display: flex; align-items: center; gap: 8px; min-width: 150px; }
.rate .track { flex: 1; height: 8px; border-radius: 4px; background: var(--border); position: relative; }
.rate .fill { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: var(--accent); }
.rate .v { font: 600 .8rem var(--font-mono); color: var(--text); min-width: 42px; text-align: right; }
.gap { color: var(--critical); font-weight: 600; }
.sugg { border-top: 1px solid var(--line, rgba(148,163,184,.3)); padding: 12px 0; }
.sugg blockquote { margin: 6px 0; padding: 6px 10px; border-left: 3px solid var(--accent, #0e7490); background: rgba(14,116,144,.06); border-radius: 4px; }
.sugg form { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 6px; }
.sugg form input[type="text"] { flex: 1 1 220px; min-width: 0; }
.bn { padding: 10px 12px; border-left: 4px solid var(--critical); margin: 8px 0; background: var(--surface); border-radius: 8px; }
</style>

      bottlenecks: 'Bottlenecks (overdue × severity)', bnHelp: 'The rules that break most and the step most often missing: one process fix closes many loops.',
      byRule: 'By rule', rule: 'Rule', missingStep: 'Step most often missing', ontimeCol: 'On time', closedLate: 'Closed late', byClin: 'Closed by clinician', deferred: 'Deferred',
      equity: 'Missed rate by patient group', eqHelp: 'Share of loops past their deadline that were not closed. A group ≥ 10 points above the overall rate (≥ 5 loops) is marked.',
      age_group: 'Age group', language: 'Language', sex: 'Sex', group: 'Group', n: 'Past deadline', missed: 'Missed', rate: 'Missed rate', above: (d) => `${d} points above overall`,
      owners: 'Workload by owner', ownHelp: 'Active and overdue loops: to share work, not to judge.', owner: 'Owner', escalated: 'Escalated',
      none: 'none', noBn: 'No loop is past its deadline.', working: 'Loading…',
      outcomes: 'After the alert: did loops actually close?', outHelp: 'For every loop that opened: whether anyone acted on it, when it closed (follow-up found in the record, or closed by staff with evidence), whether that was after the deadline, and whether it was dismissed. From the audit log; no patient identifiers.',
      oOpened: 'Loops opened', oActed: 'Acted on', oFirst: 'To first action (median)', oClosed: 'Closed (record / staff)', oDays: 'To closure (median)', oLate: 'Closed after deadline', oDismissed: 'Dismissed', oOpenOver: 'Open past deadline', oUntouched: 'of which never acted on', oNever: 'Past deadline, never acted on',
      hours: (h) => h == null ? '–' : `${h} h`, days: (d) => d == null ? '–' : `${d} d`, silentNote: 'Silent run: nothing reaches staff, so these figures describe usual care alone.',
      audit: 'Critical-result communication audit (next day)', auditHelp: 'For each critical lab or imaging result more than a day old: was the clinician notification documented within the hour? The hospital\'s critical-result call process is the primary control; this table checks its documentation afterwards.',
      total: 'Total', sr: 'Model second reader (silent measurement)', srHelp: "The hospital's own language model rereads reports and suggests follow-up no rule tracks, quoting the report. In the clinical edition its suggestions never reach the worklist, EHR or patient record: only the quality team sees and judges them. These judgements decide whether it may ever be shown to clinicians.",
      srMode: { off: 'Off (turn on with CLINLOOP_SECOND_READER=silent)', silent: 'Silent measurement: nothing reaches clinical care', live: 'Live (research profile): suggestions open R058 review loops' },
      srCat: 'Category', srN: 'Suggestions', srReviewed: 'Judged', srMiss: 'Real miss', srHandled: 'Already handled', srNotNeeded: 'Not needed', srWrong: 'Wrong quote', srPrec: 'Precision (95% CI)',
      srPending: 'Suggestions waiting for a judgement', srNone: 'No suggestion is waiting.', srReport: 'Report', srModelReason: "Model's reason", srUrgent: 'Urgent',
      srReferral: 'Safety referral: who was told, and how (required for an urgent real miss)', srNote: 'Note (optional)', srSave: 'Save judgement', srSaved: 'Saved.',
      verdicts: { real_miss: 'Real miss', already_handled: 'Already handled', not_needed: 'Not needed', wrong_quote: 'Wrong quote' },
      auditLive: 'Core profile: R022 and R035 are reported here instead of as live alerts.', auditNone: 'No critical result more than a day old.',
      result: 'Result', resultTime: 'Result time', patient: 'Patient',
      results: { not_documented: 'Not documented', documented_late: 'Documented late', documented_on_time: 'Documented within the hour', closed_by_staff: 'Closed by staff with evidence' },
      footer: 'ClinLoop AI · Finds gaps in the process. Blames no one.',
    },
  };
  const store = { get(k, s = sessionStorage) { try { return s.getItem(k) || ''; } catch { return ''; } },
                  set(k, v, s = sessionStorage) { try { s.setItem(k, v); } catch {} } };
  let lang = store.get('clinloop_lang', localStorage) || ((navigator.language || '').startsWith('ko') ? 'ko' : 'en');
  const t = () => T[lang];
  const state = { base: '', token: '', data: null, audit: null, outcomes: null, sr: null, srItems: null };
  const isLocal = ['localhost', '127.0.0.1'].includes(location.hostname);
  $('api-base').value = store.get('clinloop_api') || window.CLINLOOP_API_BASE || (isLocal ? 'http://localhost:8124' : '');
  $('token').value = store.get('clinloop_token');
  function setStatus(m, err = false) { $('status').textContent = m; $('status').classList.toggle('error', err); }
  async function api(path) {
    const res = await fetch(state.base + path, { headers: { 'Authorization': `Bearer ${state.token}` } });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) {
      // FastAPI lists form problems as objects; show their text, not "[object Object]"
      const d = body.detail;
      throw new Error(Array.isArray(d) ? d.map((x) => (x.loc ? x.loc[x.loc.length - 1] + ': ' : '') + (x.msg || '')).join('; ')
        : d || (res.status === 401 ? 'Not signed in, or the token is not recognised' : `HTTP ${res.status}`));
    }
    return body;
  }
  async function apiPost(path, body) {
    const res = await fetch(state.base + path, { method: 'POST', body: JSON.stringify(body),
      headers: { 'Authorization': `Bearer ${state.token}`, 'Content-Type': 'application/json' } });
    const out = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(typeof out.detail === 'string' ? out.detail : `HTTP ${res.status}`);
    return out;
  }
  const pct = (x) => x == null ? '–' : `${Math.round(x * 100)}%`;
  const bar = (x, label) => x == null ? '<span class="sub">–</span>'
    : `<div class="rate" title="${esc(label)}: ${pct(x)}"><div class="track"><div class="fill" style="width:${Math.round(x * 100)}%"></div></div><span class="v">${pct(x)}</span></div>`;

  function render() {
    document.documentElement.lang = lang;
    $('btn-lang').textContent = lang === 'ko' ? 'English' : '한국어';
    document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t()[el.dataset.i18n]; });
    const d = state.data;
    if (!d) return;
    const active = d.rules.reduce((a, r) => a + r.active, 0), overdue = d.rules.reduce((a, r) => a + r.overdue, 0);
    const due = d.rules.reduce((a, r) => a + r.due_passed, 0), missed = d.rules.reduce((a, r) => a + r.overdue + r.closed_late, 0);
    const overall = due ? 1 - missed / due : null;
    $('kpis').innerHTML = [[d.loops, t().loops], [active, t().active], [overdue, t().overdue], [pct(overall), t().ontime]]
      .map(([v, l]) => `<div class="card kpi"><div class="v">${esc(v)}</div><div class="l">${esc(l)}</div></div>`).join('');
    $('bn').innerHTML = d.bottlenecks.length ? d.bottlenecks.map((b) => `<div class="bn"><b>${esc(b.rule_id)}</b> ${esc(b.rule_name)}
      · <span class="chip overdue">${esc(t().overdue)} ${esc(b.overdue)}</span> <span class="chip ${esc(b.severity)}">${esc(b.severity)}</span>
      ${b.top_missing ? `<div class="sub" style="margin-top:4px;">${esc(t().missingStep)}: <b>${esc(b.top_missing)}</b></div>` : ''}</div>`).join('')
      : `<p class="sub">${esc(t().noBn)}</p>`;
    $('rules').innerHTML = `<table class="tbl"><thead><tr><th>${esc(t().rule)}</th><th class="num">${esc(t().active)}</th><th class="num">${esc(t().overdue)}</th>
      <th>${esc(t().ontimeCol)}</th><th class="num">${esc(t().closedLate)}</th><th class="num">${esc(t().byClin)}</th><th class="num">${esc(t().deferred)}</th><th>${esc(t().missingStep)}</th></tr></thead><tbody>
      ${d.rules.map((r) => `<tr><td><b>${esc(r.rule_id)}</b> ${esc(r.rule_name)}</td><td class="num">${r.active}</td>
        <td class="num">${r.overdue ? `<span class="gap">${r.overdue}</span>` : 0}</td><td>${bar(r.on_time_rate, t().ontimeCol)}</td>
        <td class="num">${r.closed_late}</td><td class="num">${r.closed_by_clinician}</td><td class="num">${r.deferred}</td>
        <td class="sub">${esc(r.top_missing || t().none)}</td></tr>`).join('')}</tbody></table>`;
    const overallMissed = due ? missed / due : null;
    $('eq').innerHTML = Object.entries(d.strata).map(([key, groups]) => `<h3 class="sub" style="margin:12px 0 4px;"><b>${esc(t()[key] || key)}</b></h3>
      <div class="scroll"><table class="tbl"><thead><tr><th>${esc(t().group)}</th><th class="num">${esc(t().n)}</th><th class="num">${esc(t().missed)}</th><th>${esc(t().rate)}</th><th></th></tr></thead><tbody>
      ${Object.entries(groups).sort((a, b) => b[1].due_passed - a[1].due_passed).map(([g, c]) => {
        const diff = overallMissed == null || c.missed_rate == null ? 0 : Math.round((c.missed_rate - overallMissed) * 100);
        return `<tr><td>${esc(g)}</td><td class="num">${c.due_passed}</td><td class="num">${c.missed}</td><td>${bar(c.missed_rate, t().rate)}</td>
          <td>${diff >= 10 && c.due_passed >= 5 ? `<span class="gap">⚠ ${esc(t().above(diff))}</span>` : ''}</td></tr>`;
      }).join('')}</tbody></table></div>`).join('');
    const o = state.outcomes;
    $('outcome-pane').hidden = !o;
    if (o) {
      const ov = o.overall;
      $('out-kpis').innerHTML = [[ov.opened, t().oOpened], [pct(ov.acted_on_share), t().oActed], [t().hours(ov.median_hours_to_first_action), t().oFirst],
        [t().days(ov.median_days_to_closure), t().oDays], [ov.open_past_deadline_never_acted_on, t().oNever]]
        .map(([v, l]) => `<div class="card kpi"><div class="v">${esc(v)}</div><div class="l">${esc(l)}</div></div>`).join('');
      $('outcomes').innerHTML = (o.silent_run ? `<p class="sub">${esc(t().silentNote)}</p>` : '') + `<table class="tbl"><thead><tr><th>${esc(t().rule)}</th>
        <th class="num">${esc(t().oOpened)}</th><th class="num">${esc(t().oActed)}</th><th class="num">${esc(t().oFirst)}</th><th class="num">${esc(t().oClosed)}</th>
        <th class="num">${esc(t().oDays)}</th><th class="num">${esc(t().oLate)}</th><th class="num">${esc(t().oDismissed)}</th><th class="num">${esc(t().oOpenOver)}</th></tr></thead><tbody>
        ${Object.entries(o.rules).map(([rid, r]) => `<tr><td><b>${esc(rid)}</b></td><td class="num">${r.opened}</td><td class="num">${r.acted_on}</td>
          <td class="num">${esc(t().hours(r.median_hours_to_first_action))}</td><td class="num">${r.closed_by_record} / ${r.closed_by_staff}</td>
          <td class="num">${esc(t().days(r.median_days_to_closure))}</td><td class="num">${r.closed_late}</td>
          <td class="num" title="${esc(Object.entries(r.defer_reasons).map(([k, v]) => `${k}: ${v}`).join(', '))}">${r.dismissed}</td>
          <td class="num">${r.open_past_deadline_never_acted_on ? `<span class="gap">${r.open_past_deadline} (${r.open_past_deadline_never_acted_on})</span>` : r.open_past_deadline}</td></tr>`).join('')}
        </tbody></table>`;
    }
    const s = state.sr;
    $('sr-pane').hidden = !s;
    if (s) {
      $('sr-mode').innerHTML = `<span class="chip ${s.mode === 'silent' ? 'ok' : 'neutral'}">${esc(t().srMode[s.mode] || s.mode)}</span>`;
      const ci = (c) => c.precision == null ? '–' : `${pct(c.precision)} (${pct(c.precision_ci95[0])}–${pct(c.precision_ci95[1])})`;
      const row = (label, c) => `<tr><td>${label}</td><td class="num">${c.n}</td><td class="num">${c.reviewed}</td><td class="num">${c.real_miss ? `<b>${c.real_miss}</b>` : 0}</td>
        <td class="num">${c.already_handled}</td><td class="num">${c.not_needed}</td><td class="num">${c.wrong_quote}</td><td class="num">${esc(ci(c))}</td></tr>`;
      $('sr-table').innerHTML = `<table class="tbl"><thead><tr><th>${esc(t().srCat)}</th><th class="num">${esc(t().srN)}</th><th class="num">${esc(t().srReviewed)}</th>
        <th class="num">${esc(t().srMiss)}</th><th class="num">${esc(t().srHandled)}</th><th class="num">${esc(t().srNotNeeded)}</th><th class="num">${esc(t().srWrong)}</th><th class="num">${esc(t().srPrec)}</th></tr></thead><tbody>
        ${Object.values(s.categories).map((c) => row(esc(c[lang] || c.en), c)).join('')}${row(`<b>${esc(t().total)}</b>`, s.total)}</tbody></table>`;
      const items = (state.srItems || []).filter((i) => !i.verdict);
      $('sr-items').innerHTML = state.srItems == null ? '' : `<h3 style="margin:16px 0 4px;">${esc(t().srPending)}</h3>` + (items.length ? items.map((i) => `
        <div class="sugg"><span class="chip neutral">${esc(i.label[lang] || i.label.en)}</span> <b>${esc(i.patient_id)}</b> · ${esc(t().srReport)} ${esc((i.report_date || '').slice(0, 10))}
          <blockquote>“${esc(i.quote)}”</blockquote><div class="sub">${esc(t().srModelReason)}: ${esc(i.reason || '–')}</div>
          <form data-sid="${esc(i.id)}"><select name="verdict" aria-label="${esc(t().srReviewed)}">${Object.entries(t().verdicts).map(([k, v]) => `<option value="${k}">${esc(v)}</option>`).join('')}</select>
            <label class="check"><input type="checkbox" name="urgent"> ${esc(t().srUrgent)}</label>
            <input type="text" name="referral" maxlength="500" placeholder="${esc(t().srReferral)}" aria-label="${esc(t().srReferral)}">
            <input type="text" name="note" maxlength="500" placeholder="${esc(t().srNote)}" aria-label="${esc(t().srNote)}">
            <button type="submit" class="primary">${esc(t().srSave)}</button></form></div>`).join('') : `<p class="sub">${esc(t().srNone)}</p>`);
    }
    const a = state.audit;
    $('audit-pane').hidden = !a;
    if (a) {
      const counts = Object.entries(a.counts).map(([k, v]) => `<span class="chip${k === 'not_documented' ? ' overdue' : ''}">${esc(t().results[k] || k)} ${esc(v)}</span>`).join(' ');
      $('audit').innerHTML = (a.replaces_live_alert ? `<p class="sub">${esc(t().auditLive)}</p>` : '') + (a.items.length
        ? `<p>${counts}</p><table class="tbl"><thead><tr><th>${esc(t().rule)}</th><th>${esc(t().patient)}</th><th>${esc(t().resultTime)}</th><th>${esc(t().result)}</th></tr></thead><tbody>
          ${a.items.map((i) => `<tr><td><b>${esc(i.rule_id)}</b> ${esc(i.rule_name)}</td><td>${esc(i.patient_id)}</td><td>${esc(i.trigger_time.slice(0, 16).replace('T', ' '))}</td>
            <td>${i.result === 'not_documented' ? `<span class="gap">${esc(t().results[i.result])}</span>` : esc(t().results[i.result] || i.result)}</td></tr>`).join('')}</tbody></table>`
        : `<p class="sub">${esc(t().auditNone)}</p>`);
    }
    $('owners').innerHTML = `<table class="tbl"><thead><tr><th>${esc(t().owner)}</th><th class="num">${esc(t().active)}</th><th class="num">${esc(t().overdue)}</th><th class="num">${esc(t().escalated)}</th></tr></thead><tbody>
      ${d.owners.map((o) => `<tr><td>${esc(o.owner)}</td><td class="num">${o.active}</td><td class="num">${o.overdue}</td><td class="num">${o.escalated}</td></tr>`).join('')}</tbody></table>`;
  }
  $('connect-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    state.base = $('api-base').value.replace(/\/+$/, '');
    state.token = $('token').value.trim();
    try {
      setStatus(t().working);
      const me = await api('/api/v1/me');
      state.data = await api('/api/v1/metrics/breakdowns');
      // Patient-level audit: navigators and above (viewers see the hospital-wide tables only)
      state.audit = await api('/api/v1/quality/documentation-audit').catch(() => null);
      state.outcomes = await api('/api/v1/quality/outcomes').catch(() => null);
      state.sr = await api('/api/v1/quality/second-reader').catch(() => null);
      // The suggestions quote reports: the quality team only (others get 403 and see the counts)
      state.srItems = await api('/api/v1/quality/second-reader/suggestions?pending=true').then((r) => r.items).catch(() => null);
      store.set('clinloop_api', state.base); store.set('clinloop_token', state.token);
      $('app').hidden = false;
      setStatus(`${(lang === 'ko' ? `${me.user}(${me.role})님으로 로그인했습니다.` : `Signed in as ${me.user} (${me.role}).`)} · ${lang === 'ko' ? '기준' : 'as of'} ${state.data.as_of.slice(0, 16).replace('T', ' ')}`);
      render();
    } catch (err) { $('app').hidden = true; setStatus(err.message, true); }
  });
  $('sr-items').addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = e.target, sid = f.dataset.sid;
    try {
      await apiPost(`/api/v1/quality/second-reader/suggestions/${encodeURIComponent(sid)}/review`, {
        verdict: f.verdict.value, urgent: f.urgent.checked, safety_referral: f.referral.value.trim(), note: f.note.value.trim() });
      state.sr = await api('/api/v1/quality/second-reader');
      state.srItems = (state.srItems || []).filter((i) => i.id !== sid);
      render();
      setStatus(t().srSaved);
    } catch (err) { setStatus(err.message, true); }
  });
  $('btn-lang').addEventListener('click', () => { lang = lang === 'ko' ? 'en' : 'ko'; store.set('clinloop_lang', lang, localStorage); render(); });
  render();
  // A token from this tab signs in automatically (js/appnav.js)
})();
</script>
</body>
</html>
