# Test, build, smoke-test and publish the ClinLoop image to GitHub Container Registry.
#
#   push to main      → ghcr.io/<owner>/clinloopai:latest  and  :sha-<short>
#   tag v1.2.3        → :1.2.3  and  :1.2
#   pull request      → tests + build + smoke test only (nothing is published)
name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-api.txt
      - name: Install dependencies
        run: pip install -r requirements-api.txt pytest
      - name: Run tests
        run: python -m pytest tests/ src/tests/ -q

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build for smoke test (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: clinloop:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container
        run: |
          docker run -d --name smoke -p 127.0.0.1:8124:8124 \
            -e CLINLOOP_API_TOKENS="smoke-admin-token-0123456789:ci:admin" \
            -e CLINLOOP_SIGNING_KEY="ci-signing-key" clinloop:smoke
          for i in $(seq 1 45); do
            curl -fsS http://127.0.0.1:8124/api/v1/health >/dev/null && break
            sleep 2
          done
          set -x
          curl -fsS http://127.0.0.1:8124/api/v1/health
          curl -fsS http://127.0.0.1:8124/worklist.html | grep -q "ClinLoop"
          curl -fsS http://127.0.0.1:8124/ | grep -q "ClinLoop"
          curl -fsS http://127.0.0.1:8124/config.js | grep -q "window.location.origin"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8124/api/v1/worklist)" = "401"
          # Ingest the synthetic FHIR bundle and confirm loops are recorded on the volume
          curl -fsS -X POST "http://127.0.0.1:8124/api/v1/fhir/ingest?evaluation_time=2026-09-01T00:00:00" \
            -H "Authorization: Bearer smoke-admin-token-0123456789" -H "Content-Type: application/json" \
            --data @data/fhir_example_bundle.json | grep -q '"patients":7'
          curl -fsS http://127.0.0.1:8124/api/v1/worklist \
            -H "Authorization: Bearer smoke-admin-token-0123456789" | grep -q "R017"
          # BioMCP is installed in the image and reachable over MCP
          docker exec smoke biomcp --version
          # Source code and the database are not served
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8124/src/clinloop_engine/api.py)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8124/clinloop.db)" = "404"
          test "$(docker inspect -f '{{.Config.User}}' clinloop:smoke)" = "clinloop"

      - name: Container logs on failure
        if: failure()
        run: docker logs smoke || true

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and publish (amd64 + arm64)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
