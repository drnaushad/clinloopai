# ClinLoop AI — on-premise stack
#
# One command (creates .env with fresh secrets, pulls images, starts everything):
#   curl -fsSL https://raw.githubusercontent.com/drnaushad/clinloopai/main/install.sh | bash
#
# Or by hand, next to a .env file containing CLINLOOP_API_TOKENS and CLINLOOP_SIGNING_KEY:
#   docker compose up -d        →  http://localhost:8124/worklist.html
#
# Services
#   clinloop-api   API + clinician worklist + cockpit (published image)
#   biomcp         BioMCP over MCP streamable HTTP (same image; needs outbound internet)
#   ollama         on-premise LLM            ┐ profile "llm": on by default via .env
#   ollama-pull    one-off model download    ┘ (COMPOSE_PROFILES=llm)
#
# Already running Ollama on this host? Remove COMPOSE_PROFILES from .env and set
#   CLINLOOP_OLLAMA_URL=http://host.docker.internal:11434

x-image: &clinloop-image ghcr.io/drnaushad/clinloopai:${CLINLOOP_VERSION:-latest}

services:
  clinloop-api:
    image: *clinloop-image
    ports:
      # 127.0.0.1 only by default. For clinicians on the hospital network, put an
      # HTTPS reverse proxy in front instead of exposing this port in plain HTTP.
      - "${CLINLOOP_BIND:-127.0.0.1}:8124:8124"
    environment:
      CLINLOOP_API_TOKENS: ${CLINLOOP_API_TOKENS:?set CLINLOOP_API_TOKENS in .env}
      CLINLOOP_SIGNING_KEY: ${CLINLOOP_SIGNING_KEY:?set CLINLOOP_SIGNING_KEY in .env}
      CLINLOOP_OLLAMA_URL: ${CLINLOOP_OLLAMA_URL:-http://ollama:11434}
      CLINLOOP_LLM_MODEL: ${CLINLOOP_LLM_MODEL:-exaone3.5:7.8b}
      CLINLOOP_BIOMCP_URL: http://biomcp:8000/mcp
      CLINLOOP_FHIR_BASE: ${CLINLOOP_FHIR_BASE:-}
      CLINLOOP_FHIR_TOKEN: ${CLINLOOP_FHIR_TOKEN:-}
      CLINLOOP_OUTREACH_PROVIDER: ${CLINLOOP_OUTREACH_PROVIDER:-outbox}
      CLINLOOP_OUTREACH_WEBHOOK_URL: ${CLINLOOP_OUTREACH_WEBHOOK_URL:-}
      NCBI_API_KEY: ${NCBI_API_KEY:-}
      # Governance: shadow mode for rules a specialist has not signed off (set 1 for clinical use),
      # approvals needed per rule, and the hospital's own critical-finding list (on the data volume)
      CLINLOOP_ENFORCE_SIGNOFF: ${CLINLOOP_ENFORCE_SIGNOFF:-0}
      CLINLOOP_SIGNOFF_APPROVALS: ${CLINLOOP_SIGNOFF_APPROVALS:-1}
      CLINLOOP_CRITICAL_FINDINGS: ${CLINLOOP_CRITICAL_FINDINGS:-}
      # Imaging: PACS study labels (DICOMweb), imaging models, research-model findings opening loops (0/1)
      CLINLOOP_PACS_DICOMWEB: ${CLINLOOP_PACS_DICOMWEB:-}
      CLINLOOP_PACS_TOKEN: ${CLINLOOP_PACS_TOKEN:-}
      CLINLOOP_IMAGING_MODELS: ${CLINLOOP_IMAGING_MODELS:-}
      CLINLOOP_IMAGING_MODELS_CONFIG: ${CLINLOOP_IMAGING_MODELS_CONFIG:-}
      CLINLOOP_IMAGING_RESEARCH_AI: ${CLINLOOP_IMAGING_RESEARCH_AI:-0}
      # Vision-language model (add "vlm" to CLINLOOP_IMAGING_MODELS), e.g. MedGemma pulled into the ollama service
      CLINLOOP_VLM_URL: ${CLINLOOP_VLM_URL:-http://ollama:11434}
      CLINLOOP_VLM_MODEL: ${CLINLOOP_VLM_MODEL:-}
      # CT organ measurement (add "totalseg"; image built with WITH_CT_SEGMENTATION=1); 0 = full 1.5 mm model
      CLINLOOP_CT_SEG_FAST: ${CLINLOOP_CT_SEG_FAST:-1}
      # DICOM dates/times are local: the hospital's time zone (IANA name)
      CLINLOOP_LOCAL_TZ: ${CLINLOOP_LOCAL_TZ:-Asia/Seoul}
    volumes:
      - clinloop-data:/var/lib/clinloop
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach an Ollama already running on the host
    depends_on:
      - biomcp
    restart: unless-stopped

  biomcp:
    image: *clinloop-image
    command: ["biomcp", "run", "--mode", "streamable_http", "--host", "0.0.0.0", "--port", "8000"]
    expose:
      - "8000"
    volumes:
      - biomcp-cache:/var/lib/clinloop
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    profiles: ["llm"]
    volumes:
      - ollama-models:/root/.ollama
    expose:
      - "11434"
    restart: unless-stopped
    # NVIDIA GPU (requires the NVIDIA Container Toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  ollama-pull:
    # One-off: download the model into the shared volume, then exit
    image: ollama/ollama:latest
    profiles: ["llm"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${CLINLOOP_LLM_MODEL:-exaone3.5:7.8b}"]
    depends_on:
      - ollama
    restart: "no"

volumes:
  clinloop-data:
  biomcp-cache:
  ollama-models:
