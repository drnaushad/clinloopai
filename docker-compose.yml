# ClinLoop AI — on-premise stack: API + BioMCP + local LLM (Ollama)
#
#   export CLINLOOP_API_TOKENS="$(openssl rand -hex 16):dr.lee:admin"
#   export CLINLOOP_SIGNING_KEY="$(openssl rand -hex 32)"
#   docker compose up -d
#
# The API listens on 127.0.0.1:8124 only. BioMCP and Ollama are reachable
# only inside this compose network. BioMCP needs outbound internet to reach
# PubMed / ClinicalTrials.gov / openFDA; patient data is never sent to it.

services:
  clinloop-api:
    build: .
    ports:
      - "127.0.0.1:8124:8124"
    environment:
      CLINLOOP_API_TOKENS: ${CLINLOOP_API_TOKENS:?set CLINLOOP_API_TOKENS}
      CLINLOOP_SIGNING_KEY: ${CLINLOOP_SIGNING_KEY:?set CLINLOOP_SIGNING_KEY}
      CLINLOOP_OLLAMA_URL: http://ollama:11434
      CLINLOOP_LLM_MODEL: ${CLINLOOP_LLM_MODEL:-exaone3.5:7.8b}
      CLINLOOP_BIOMCP_URL: http://biomcp:8000/mcp
      CLINLOOP_FHIR_BASE: ${CLINLOOP_FHIR_BASE:-}
      CLINLOOP_FHIR_TOKEN: ${CLINLOOP_FHIR_TOKEN:-}
      NCBI_API_KEY: ${NCBI_API_KEY:-}
    volumes:
      - clinloop-data:/var/lib/clinloop
    depends_on:
      - biomcp
      - ollama
    restart: unless-stopped

  biomcp:
    image: python:3.12-slim
    command: >
      sh -c "pip install --no-cache-dir biomcp-python==0.7.3 &&
             biomcp run --mode streamable_http --host 0.0.0.0 --port 8000"
    expose:
      - "8000"
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    expose:
      - "11434"
    restart: unless-stopped
    # NVIDIA GPU (requires the NVIDIA Container Toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  ollama-pull:
    # One-off: download the model into the shared volume, then exit
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${CLINLOOP_LLM_MODEL:-exaone3.5:7.8b}"]
    depends_on:
      - ollama
    restart: "no"

volumes:
  clinloop-data:
  ollama-models:
