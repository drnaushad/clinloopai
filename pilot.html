<style>
:root {
  --bg: #f1f5f9; --surface: #ffffff; --border: #e2e8f0; --border-strong: #cbd5e1;
  --text: #0f172a; --muted: #475569; --dim: #556274;
  --accent: #0369a1; --accent-soft: rgba(3,105,161,.10);
  --critical: #be123c; --critical-soft: rgba(225,29,72,.10);
  --high: #c2410c; --high-soft: rgba(234,88,12,.10);
  --moderate: #854d0e; --moderate-soft: rgba(202,138,4,.12);
  --low: #475569; --low-soft: rgba(71,85,105,.10);
  --ok: #065f46; --ok-soft: rgba(5,150,105,.10);
  --radius: 12px; --shadow: 0 4px 14px rgba(15,23,42,.06);
  --font-head: 'Outfit', 'Noto Sans KR', system-ui, sans-serif;
  --font-body: 'Plus Jakarta Sans', 'Noto Sans KR', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #060b16; --surface: #0d1526; --border: rgba(255,255,255,.08); --border-strong: rgba(255,255,255,.16);
    --text: #f1f5f9; --muted: #a3b1c6; --dim: #7c8aa0;
    --accent: #38bdf8; --accent-soft: rgba(56,189,248,.12);
    --critical: #fb7185; --critical-soft: rgba(251,113,133,.14);
    --high: #fb923c; --high-soft: rgba(251,146,60,.14);
    --moderate: #facc15; --moderate-soft: rgba(250,204,21,.12);
    --low: #94a3b8; --low-soft: rgba(148,163,184,.12);
    --ok: #34d399; --ok-soft: rgba(52,211,153,.12);
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #060b16; --surface: #0d1526; --border: rgba(255,255,255,.08); --border-strong: rgba(255,255,255,.16);
  --text: #f1f5f9; --muted: #a3b1c6; --dim: #7c8aa0;
  --accent: #38bdf8; --accent-soft: rgba(56,189,248,.12);
  --critical: #fb7185; --critical-soft: rgba(251,113,133,.14);
  --high: #fb923c; --high-soft: rgba(251,146,60,.14);
  --moderate: #facc15; --moderate-soft: rgba(250,204,21,.12);
  --low: #94a3b8; --low-soft: rgba(148,163,184,.12);
  --ok: #34d399; --ok-soft: rgba(52,211,153,.12);
  --shadow: none;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 var(--font-body); }
.wrap { max-width: 1120px; margin: 0 auto; padding: 20px 16px 64px; }
header { display: flex; flex-wrap: wrap; gap: 12px; align-items: baseline; justify-content: space-between; }
header nav { display: flex; gap: 12px; align-items: center; }
h1 { font: 800 1.6rem/1.2 var(--font-head); margin: 0; letter-spacing: -.01em; }
h1 span { color: var(--accent); }
.sub { color: var(--muted); margin: 4px 0 0; }
a { color: var(--accent); font-weight: 600; }
.banner { margin: 16px 0; padding: 10px 14px; border-radius: var(--radius); background: var(--moderate-soft);
  border: 1px solid var(--border); font-size: .9rem; }
.feed { margin: 0 0 16px; padding: 10px 14px; border-radius: var(--radius); font-size: .9rem; font-weight: 600;
  border: 1px solid var(--border); }
.feed.ok { background: var(--ok-soft); color: var(--ok); font-weight: 500; }
.feed.alarm { background: var(--critical); color: #fff; }
.feed.warn { background: #f6edd9; color: #5c4300; font-weight: 500; }
@media (prefers-color-scheme: dark) { .feed.warn { background: #3a2f17; color: #f3d99b; } }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
.connect { display: grid; grid-template-columns: 1fr 1.4fr auto; gap: 10px; padding: 14px; align-items: end; }
label { display: block; font-size: .78rem; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
input, select, textarea { width: 100%; font: inherit; color: var(--text); background: var(--bg);
  border: 1px solid var(--border-strong); border-radius: 8px; padding: 8px 10px; }
textarea { min-height: 72px; resize: vertical; }
button { font: 600 .88rem var(--font-body); border-radius: 8px; padding: 8px 14px; cursor: pointer;
  border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.danger { color: var(--critical); }
button:disabled { opacity: .5; cursor: not-allowed; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible, a:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px; }
.status-line { padding: 0 14px 12px; font-size: .85rem; color: var(--muted); min-height: 1.4em; }
.status-line.error { color: var(--critical); }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 16px 0; }
.kpi { padding: 12px 14px; }
.kpi .v { font: 700 1.6rem/1.1 var(--font-head); font-variant-numeric: tabular-nums; }
.kpi .l { font-size: .8rem; color: var(--muted); }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0 12px; }
.toolbar .spacer { flex: 1; }
.check { display: flex; gap: 6px; align-items: center; margin: 0; color: var(--text); font-weight: 500; font-size: .88rem; }
.check input { width: auto; }
.loop { padding: 14px; margin-bottom: 10px; border-left: 4px solid var(--low); }
.loop.critical { border-left-color: var(--critical); }
.loop.high { border-left-color: var(--high); }
.loop.moderate { border-left-color: var(--moderate); }
.loop-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.loop-title { font-weight: 700; flex: 1 1 260px; }
.chip { font: 600 .72rem var(--font-mono); padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.chip.critical { background: var(--critical-soft); color: var(--critical); }
.chip.high { background: var(--high-soft); color: var(--high); }
.chip.moderate { background: var(--moderate-soft); color: var(--moderate); }
.chip.low, .chip.neutral { background: var(--low-soft); color: var(--low); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.overdue { background: var(--critical); color: #fff; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--muted); font-size: .85rem; margin: 6px 0; }
.meta b { color: var(--text); font-weight: 600; }
.missing { font-weight: 600; margin: 4px 0; }
.action { color: var(--muted); font-size: .9rem; }
details { margin-top: 8px; }
summary { cursor: pointer; color: var(--accent); font-size: .85rem; font-weight: 600; }
.evidence { font: .78rem/1.5 var(--font-mono); color: var(--muted); background: var(--bg); padding: 10px; margin-top: 6px;
  border-radius: 8px; overflow-x: auto; white-space: pre-wrap; word-break: break-word; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.form { display: none; gap: 8px; margin-top: 10px; padding: 12px; border-radius: 8px; background: var(--bg); }
.form.open { display: grid; }
.form .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.msg { border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-top: 8px; background: var(--surface); }
.msg-text { white-space: pre-wrap; margin: 6px 0; }
.empty { text-align: center; color: var(--muted); padding: 40px 16px; }
.rate-table { width: 100%; border-collapse: collapse; font-size: .88rem; }
.rate-table th, .rate-table td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
.rate-table td.num, .rate-table th.num { font-variant-numeric: tabular-nums; text-align: right; }
footer { margin-top: 32px; color: var(--dim); font-size: .8rem; }
@media (max-width: 720px) {
  .connect { grid-template-columns: 1fr; }
  .kpis { grid-template-columns: repeat(2, 1fr); }
  .form .row { grid-template-columns: 1fr; }
}
</style>
<style>
.pane { padding: 16px; margin-top: 16px; }
.pane h2 { font: 700 1.1rem var(--font-head); margin: 0 0 4px; }
.tbl { width: 100%; border-collapse: collapse; font-size: .86rem; }
.tbl th, .tbl td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; overflow-wrap: anywhere; }
.tbl td.num, .tbl th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.scroll { overflow-x: auto; }
.rate { display: flex; align-items: center; gap: 8px; min-width: 150px; }
.rate .track { flex: 1; height: 8px; border-radius: 4px; background: var(--border); position: relative; }
.rate .fill { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: var(--accent); }
.rate .v { font: 600 .8rem var(--font-mono); color: var(--text); min-width: 42px; text-align: right; }
.gap { color: var(--critical); font-weight: 600; }
.bn { padding: 10px 12px; border-left: 4px solid var(--critical); margin: 8px 0; background: var(--surface); border-radius: 8px; }
.q { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
.q fieldset { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin: 0; }
.q legend { font-size: .8rem; font-weight: 700; color: var(--text); padding: 0 4px; }
.q label.opt { display: flex; gap: 6px; align-items: center; color: var(--text); font-weight: 500; font-size: .88rem; margin: 2px 0; }
.q label.opt input { width: auto; }
.crit td.pass { color: var(--ok); font-weight: 700; } .crit td.fail { color: var(--critical); font-weight: 700; }
@media (max-width: 720px) { .q { grid-template-columns: 1fr; } }
</style>

(() => {

  const isLocal = ['localhost', '127.0.0.1'].includes(location.hostname);
  $('api-base').value = store.get('clinloop_api') || window.CLINLOOP_API_BASE || (isLocal ? 'http://localhost:8124' : '');
  $('token').value = store.get('clinloop_token');
  function setStatus(m, err = false) { $('status').textContent = m; $('status').classList.toggle('error', err); }
  async function api(path, opts = {}) {
    const res = await fetch(state.base + path, { ...opts, headers: { 'Authorization': `Bearer ${state.token}`, 'Content-Type': 'application/json' } });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) {
      const d = body.detail;
      throw new Error(Array.isArray(d) ? d.map((x) => (x.loc ? x.loc[x.loc.length - 1] + ': ' : '') + (x.msg || '')).join('; ')
        : d || (res.status === 401 ? 'Not signed in, or the token is not recognised' : `HTTP ${res.status}`));
    }
    return body;
  }
  const pct = (x) => x == null ? '–' : `${Math.round(x * 100)}%`;
  const radios = (name, opts, id) => opts.map((o) => `<label class="opt"><input type="radio" name="${name}" value="${o}" required> ${esc(t()[o])}</label>`).join('');

  function itemCard(it, i) {
    const l = it.loop, id = `q${i}`;
    return `<article class="card loop ${esc(l.severity)}" data-key="${esc(l.loop_key)}">
      <div class="loop-head"><span class="loop-title">${esc(l.rule_id)} · ${esc(l.rule_name)}</span>
        <span class="chip ${esc(l.severity)}">${esc(l.severity)}</span><span class="chip neutral">${esc(t().reviews(it.reviews_so_far, it.reviews_needed))}</span></div>
      <div class="meta"><span>${esc(l.patient_id)}</span><span>${esc(t().deadline)}: <b>${esc((l.deadline || '').slice(0, 10))}</b></span></div>
      ${l.missing_step ? `<div class="missing">${esc(t().missing)}: ${esc(l.missing_step)}</div>` : ''}
      <details><summary>${esc(t().evidence)}</summary><div class="evidence">${esc(JSON.stringify(l.evidence_chain, null, 1))}</div></details>
      <form class="review" data-key="${esc(l.loop_key)}">
        <div class="q">
          <fieldset><legend>${esc(t().qa)}</legend>${radios(`${id}a`, ['yes', 'no', 'unclear'])}</fieldset>
          <fieldset><legend>${esc(t().qb)}</legend>${radios(`${id}b`, ['yes', 'no', 'unknown'])}</fieldset>
          <fieldset><legend>${esc(t().qc)}</legend>${radios(`${id}c`, ['yes', 'no', 'unclear'])}</fieldset>
        </div>
        <label class="check" for="${id}u" style="margin-top:8px;"><input id="${id}u" name="urgent" type="checkbox"> ${esc(t().urgent)}</label>
        <div class="ref" hidden><label for="${id}r">${esc(t().referral)}</label><input id="${id}r" name="referral" maxlength="1000" placeholder="${esc(t().referralPh)}"></div>
        <div><label for="${id}n">${esc(t().note2)}</label><input id="${id}n" name="note" maxlength="2000"></div>
        <div class="actions"><button class="primary" type="submit">${esc(t().submit)}</button></div>
      </form></article>`;
  }

  function render() {
    document.documentElement.lang = lang;
    $('btn-lang').textContent = lang === 'ko' ? 'English' : '한국어';
    document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t()[el.dataset.i18n]; });
    if (!state.status) return;
    const s = state.status, m = state.metrics;
    $('mode').className = `feed ${s.silent_run ? 'ok' : 'warn'}`;
    $('mode').textContent = s.silent_run ? t().silentOn : t().silentOff;
    $('kpis').innerHTML = [[s.monitored_patients, t().kPatients], [s.sampled, t().kSampled], [m ? m.reviewed : '–', t().kReviewed],
      [m ? pct(m.ppv.value) : '–', t().kPpv]].map(([v, l]) => `<div class="card kpi"><div class="v">${esc(v)}</div><div class="l">${esc(l)}</div></div>`).join('');
    $('sample-pane').hidden = !(state.me && state.me.role === 'admin');
    if (!s.you_review) { $('queue').innerHTML = `<p class="sub">${esc(t().notReviewer)}</p>`; $('criteria').innerHTML = ''; $('families').innerHTML = ''; $('safety').innerHTML = ''; return; }
    $('queue').innerHTML = state.queue.length ? state.queue.map(itemCard).join('') : `<p class="sub">${esc(t().noQueue)}</p>`;
    if (m) {
      const fmt = (v, unit) => v == null ? '–' : unit === 'share' ? `${(v * 100).toFixed(2)}%` : v;
      $('criteria').innerHTML = `<table class="tbl crit"><thead><tr><th>${esc(t().criterion)}</th><th class="num">${esc(t().value)}</th><th>${esc(t().result)}</th></tr></thead><tbody>
        ${m.go_no_go.map((c) => `<tr><td>${esc(c.criterion)}</td><td class="num">${esc(fmt(c.value, c.unit))}</td><td class="${esc(c.result)}">${esc(t().results[c.result] || c.result)}</td></tr>`).join('')}
        <tr><td>${esc(t().kappa)}</td><td class="num">${esc(m.agreement.observed == null ? '–' : pct(m.agreement.observed) + ' · κ ' + (m.agreement.kappa ?? '–'))}</td><td></td></tr>
        <tr><td>${esc(t().observed)}</td><td class="num">${esc(m.days_observed)} / ${esc(m.minimum_days)}</td><td></td></tr>
        <tr><td>${esc(t().discordant)}</td><td class="num">${esc(m.discordant)}</td><td></td></tr>
        <tr><td>${esc(t().closedLater)}</td><td class="num">${esc(m.truly_open_closed_later_by_usual_care.count)} / ${esc(m.truly_open_closed_later_by_usual_care.of)}</td><td></td></tr>
        <tr><td>${esc(t().delay)}</td><td class="num">${esc(m.usual_care_delay_days.median ?? '–')} (n ${esc(m.usual_care_delay_days.n)})</td><td></td></tr></tbody></table>`;
      const fam = Object.entries(m.ppv_by_family);
      $('families').innerHTML = fam.length ? `<table class="tbl"><thead><tr><th>${esc(t().family)}</th><th class="num">${esc(t().reviewed)}</th><th class="num">${esc(t().open)}</th><th class="num">${esc(t().ppv)}</th></tr></thead><tbody>
        ${fam.map(([f, r]) => `<tr><td>${esc(f.replace(/_/g, ' '))}</td><td class="num">${r.reviewed}</td><td class="num">${r.truly_open}</td>
          <td class="num">${pct(r.ppv)} (${pct(r.ci_low)}–${pct(r.ci_high)})</td></tr>`).join('')}</tbody></table>` : '';
    }
    $('safety').innerHTML = state.safety.length ? `<table class="tbl"><tbody>${state.safety.map((r) => `<tr><td>${esc(r.reviewed_at.slice(0, 16).replace('T', ' '))}</td>
      <td>${esc(r.loop_key.split('|').slice(0, 2).join(' · '))}</td><td>${esc(r.reviewer)}</td><td>${esc(r.safety_referral)}</td></tr>`).join('')}</tbody></table>`
      : `<p class="sub">${esc(t().noSafety)}</p>`;
  }

  async function reload() {
    state.status = await api('/api/v1/pilot/status');
    if (state.status.you_review) {
      const [q, m, sr] = await Promise.all([api('/api/v1/pilot/queue'), api('/api/v1/pilot/metrics'), api('/api/v1/pilot/safety-referrals')]);
      state.queue = q.items; state.metrics = m; state.safety = sr.referrals;
    }
    render();
  }

  $('connect-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    state.base = $('api-base').value.replace(/\/+$/, '');
    state.token = $('token').value.trim();
    try {
      setStatus(t().working);
      state.me = await api('/api/v1/me');
      store.set('clinloop_api', state.base); store.set('clinloop_token', state.token);
      await reload();
      $('app').hidden = false;
      setStatus((lang === 'ko' ? `${state.me.user}(${state.me.role})님으로 로그인했습니다.` : `Signed in as ${state.me.user} (${state.me.role}).`));
    } catch (err) { $('app').hidden = true; setStatus(err.message, true); }
  });
  $('sample-all').addEventListener('change', () => { $('sample-size').disabled = $('sample-all').checked; });
  $('sample-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
      const r = await api('/api/v1/pilot/sample', { method: 'POST', body: JSON.stringify({ size: $('sample-all').checked ? null : Number($('sample-size').value) }) });
      setStatus(t().drawn(r));
      await reload();
    } catch (err) { setStatus(err.message, true); }
  });
  $('export').addEventListener('click', async (e) => {
    e.preventDefault();
    try {
      const res = await fetch(state.base + '/api/v1/pilot/export.csv', { headers: { 'Authorization': `Bearer ${state.token}` } });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const a = document.createElement('a');
      a.href = URL.createObjectURL(await res.blob()); a.download = 'clinloop_silent_run_reviews.csv'; a.click();
    } catch (err) { setStatus(err.message, true); }
  });
  $('queue').addEventListener('change', (e) => {
    if (e.target.name === 'urgent') {
      const ref = e.target.closest('form').querySelector('.ref');
      ref.hidden = !e.target.checked;
      ref.querySelector('input').required = e.target.checked;
    }
  });
  $('queue').addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = e.target, d = new FormData(f), id = f.querySelector('input[type=radio]').name.slice(0, -1);
    try {
      await api('/api/v1/pilot/reviews', { method: 'POST', body: JSON.stringify({ loop_key: f.dataset.key,
        truly_open: d.get(`${id}a`), usual_care: d.get(`${id}b`), important: d.get(`${id}c`),
        urgent: d.get('urgent') === 'on', safety_referral: d.get('referral') || '', note: d.get('note') || '' }) });
      setStatus(t().saved);
      await reload();
    } catch (err) { setStatus(err.message, true); }
  });
  $('btn-lang').addEventListener('click', () => { lang = lang === 'ko' ? 'en' : 'ko'; store.set('clinloop_lang', lang, localStorage); render(); });
  render();
})();
</script>
</body>
</html>
