<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClinLoop Imaging</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f1f5f9; --surface: #ffffff; --border: #e2e8f0; --border-strong: #cbd5e1;
  --text: #0f172a; --muted: #475569; --dim: #64748b;
  --accent: #0284c7; --accent-soft: rgba(2,132,199,.10);
  --critical: #be123c; --critical-soft: rgba(225,29,72,.10);
  --high: #c2410c; --high-soft: rgba(234,88,12,.10);
  --moderate: #a16207; --moderate-soft: rgba(202,138,4,.12);
  --low: #475569; --low-soft: rgba(71,85,105,.10);
  --ok: #047857; --ok-soft: rgba(5,150,105,.10);
  --radius: 12px; --shadow: 0 4px 14px rgba(15,23,42,.06);
  --font-head: 'Outfit', 'Noto Sans KR', system-ui, sans-serif;
  --font-body: 'Plus Jakarta Sans', 'Noto Sans KR', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #060b16; --surface: #0d1526; --border: rgba(255,255,255,.08); --border-strong: rgba(255,255,255,.16);
    --text: #f1f5f9; --muted: #a3b1c6; --dim: #7c8aa0;
    --accent: #38bdf8; --accent-soft: rgba(56,189,248,.12);
    --critical: #fb7185; --critical-soft: rgba(251,113,133,.14);
    --high: #fb923c; --high-soft: rgba(251,146,60,.14);
    --moderate: #facc15; --moderate-soft: rgba(250,204,21,.12);
    --low: #94a3b8; --low-soft: rgba(148,163,184,.12);
    --ok: #34d399; --ok-soft: rgba(52,211,153,.12);
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #060b16; --surface: #0d1526; --border: rgba(255,255,255,.08); --border-strong: rgba(255,255,255,.16);
  --text: #f1f5f9; --muted: #a3b1c6; --dim: #7c8aa0;
  --accent: #38bdf8; --accent-soft: rgba(56,189,248,.12);
  --critical: #fb7185; --critical-soft: rgba(251,113,133,.14);
  --high: #fb923c; --high-soft: rgba(251,146,60,.14);
  --moderate: #facc15; --moderate-soft: rgba(250,204,21,.12);
  --low: #94a3b8; --low-soft: rgba(148,163,184,.12);
  --ok: #34d399; --ok-soft: rgba(52,211,153,.12);
  --shadow: none;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 var(--font-body); }
.wrap { max-width: 1120px; margin: 0 auto; padding: 20px 16px 64px; }
header { display: flex; flex-wrap: wrap; gap: 12px; align-items: baseline; justify-content: space-between; }
header nav { display: flex; gap: 12px; align-items: center; }
h1 { font: 800 1.6rem/1.2 var(--font-head); margin: 0; letter-spacing: -.01em; }
h1 span { color: var(--accent); }
.sub { color: var(--muted); margin: 4px 0 0; }
a { color: var(--accent); font-weight: 600; }
.banner { margin: 16px 0; padding: 10px 14px; border-radius: var(--radius); background: var(--moderate-soft);
  border: 1px solid var(--border); font-size: .9rem; }
.feed { margin: 0 0 16px; padding: 10px 14px; border-radius: var(--radius); font-size: .9rem; font-weight: 600;
  border: 1px solid var(--border); }
.feed.ok { background: var(--ok-soft); color: var(--ok); font-weight: 500; }
.feed.alarm { background: var(--critical); color: #fff; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
.connect { display: grid; grid-template-columns: 1fr 1.4fr auto; gap: 10px; padding: 14px; align-items: end; }
label { display: block; font-size: .78rem; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
input, select, textarea { width: 100%; font: inherit; color: var(--text); background: var(--bg);
  border: 1px solid var(--border-strong); border-radius: 8px; padding: 8px 10px; }
textarea { min-height: 72px; resize: vertical; }
button { font: 600 .88rem var(--font-body); border-radius: 8px; padding: 8px 14px; cursor: pointer;
  border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.danger { color: var(--critical); }
button:disabled { opacity: .5; cursor: not-allowed; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible, a:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px; }
.status-line { padding: 0 14px 12px; font-size: .85rem; color: var(--muted); min-height: 1.4em; }
.status-line.error { color: var(--critical); }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 16px 0; }
.kpi { padding: 12px 14px; }
.kpi .v { font: 700 1.6rem/1.1 var(--font-head); font-variant-numeric: tabular-nums; }
.kpi .l { font-size: .8rem; color: var(--muted); }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0 12px; }
.toolbar .spacer { flex: 1; }
.check { display: flex; gap: 6px; align-items: center; margin: 0; color: var(--text); font-weight: 500; font-size: .88rem; }
.check input { width: auto; }
.loop { padding: 14px; margin-bottom: 10px; border-left: 4px solid var(--low); }
.loop.critical { border-left-color: var(--critical); }
.loop.high { border-left-color: var(--high); }
.loop.moderate { border-left-color: var(--moderate); }
.loop-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.loop-title { font-weight: 700; flex: 1 1 260px; }
.chip { font: 600 .72rem var(--font-mono); padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.chip.critical { background: var(--critical-soft); color: var(--critical); }
.chip.high { background: var(--high-soft); color: var(--high); }
.chip.moderate { background: var(--moderate-soft); color: var(--moderate); }
.chip.low, .chip.neutral { background: var(--low-soft); color: var(--low); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.overdue { background: var(--critical); color: #fff; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--muted); font-size: .85rem; margin: 6px 0; }
.meta b { color: var(--text); font-weight: 600; }
.missing { font-weight: 600; margin: 4px 0; }
.action { color: var(--muted); font-size: .9rem; }
details { margin-top: 8px; }
summary { cursor: pointer; color: var(--accent); font-size: .85rem; font-weight: 600; }
.evidence { font: .78rem/1.5 var(--font-mono); color: var(--muted); background: var(--bg); padding: 10px; margin-top: 6px;
  border-radius: 8px; overflow-x: auto; white-space: pre-wrap; word-break: break-word; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.form { display: none; gap: 8px; margin-top: 10px; padding: 12px; border-radius: 8px; background: var(--bg); }
.form.open { display: grid; }
.form .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.msg { border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-top: 8px; background: var(--surface); }
.msg-text { white-space: pre-wrap; margin: 6px 0; }
.empty { text-align: center; color: var(--muted); padding: 40px 16px; }
.rate-table { width: 100%; border-collapse: collapse; font-size: .88rem; }
.rate-table th, .rate-table td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
.rate-table td.num, .rate-table th.num { font-variant-numeric: tabular-nums; text-align: right; }
footer { margin-top: 32px; color: var(--dim); font-size: .8rem; }
@media (max-width: 720px) {
  .connect { grid-template-columns: 1fr; }
  .kpis { grid-template-columns: repeat(2, 1fr); }
  .form .row { grid-template-columns: 1fr; }
}
</style>
<style>
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
.pane { padding: 16px; }
.pane h2 { font: 700 1.1rem var(--font-head); margin: 0 0 4px; }
.pane .sub { font-size: .85rem; margin: 0 0 12px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stack { display: grid; gap: 10px; }
.preview { width: 100%; max-height: 420px; object-fit: contain; background: #000; border-radius: 8px; }
.kv { display: grid; grid-template-columns: 140px 1fr; gap: 2px 10px; font-size: .85rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.qa { padding: 8px 10px; border-radius: 8px; font-size: .85rem; margin: 4px 0; }
.qa.critical { background: var(--critical); color: #fff; font-weight: 600; }
.qa.warning { background: var(--moderate-soft); }
.qa.info { background: var(--accent-soft); }
.bar { height: 8px; border-radius: 4px; background: var(--border); position: relative; overflow: hidden; min-width: 80px; }
.bar span { position: absolute; inset: 0 auto 0 0; background: var(--accent); }
.bar span.pos { background: var(--critical); }
.find-table { width: 100%; border-collapse: collapse; font-size: .84rem; }
.find-table td, .find-table th { padding: 4px 6px; border-bottom: 1px solid var(--border); text-align: left; }
.find-table td.num { text-align: right; font-variant-numeric: tabular-nums; width: 56px; }
.model { border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-top: 10px; }
.mono { font-family: var(--font-mono); font-size: .78rem; }
.textbox { white-space: pre-wrap; max-height: 220px; overflow: auto; }
.result { margin-top: 10px; }
@media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } .row2 { grid-template-columns: 1fr; } .kv { grid-template-columns: 1fr; } }
</style>
<script src="config.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>ClinLoop <span data-i18n="title"></span></h1>
      <p class="sub" data-i18n="subtitle"></p>
    </div>
    <nav>
      <button type="button" id="btn-lang" aria-label="Language">English</button>
      <a href="worklist.html" data-i18n="worklist"></a>
    </nav>
  </header>

  <div class="banner" role="note" data-i18n="disclaimer"></div>

  <section class="card" aria-label="Connection">
    <form class="connect" id="connect-form">
      <div><label for="api-base" data-i18n="api"></label><input id="api-base" type="url" placeholder="http://localhost:8124" required></div>
      <div><label for="token" data-i18n="token"></label><input id="token" type="password" autocomplete="off" required></div>
      <button class="primary" type="submit" data-i18n="signin"></button>
    </form>
    <div class="status-line" id="status" aria-live="polite"></div>
  </section>

  <div id="app" hidden>
    <section class="card pane" style="margin-top:16px;">
      <div class="row2">
        <div><label for="patient" data-i18n="patient"></label><input id="patient" placeholder="RP-01" autocomplete="off"></div>
        <div id="services" class="sub" style="align-self:end;"></div>
      </div>
    </section>

    <section class="card pane" aria-labelledby="h-scan" style="margin-top:16px;">
      <div class="loop-head"><h2 id="h-scan" data-i18n="scanTitle"></h2>
        <button type="button" id="scan-run" hidden data-i18n="scanRun"></button></div>
      <p class="sub" data-i18n="scanHelp"></p>
      <div id="scan-status" class="result" aria-live="polite"></div>
    </section>

    <div class="grid2">
      <section class="card pane" aria-labelledby="h-report">
        <h2 id="h-report" data-i18n="reportTitle"></h2>
        <p class="sub" data-i18n="reportHelp"></p>
        <form id="report-form" class="stack">
          <div><label for="report-file" data-i18n="reportFile"></label>
            <input id="report-file" type="file" accept=".pdf,.png,.jpg,.jpeg,.tif,.tiff,image/*,application/pdf" required></div>
          <div><button class="primary" type="submit" data-i18n="extract"></button></div>
        </form>
        <form id="file-form" class="stack" hidden style="margin-top:12px;">
          <div id="extract-meta" class="sub"></div>
          <div class="row2">
            <div><label for="r-title" data-i18n="studyTitle"></label><input id="r-title"></div>
            <div><label for="r-date" data-i18n="reportDate"></label><input id="r-date" type="date"></div>
          </div>
          <div><label for="r-impression" data-i18n="impression"></label><textarea id="r-impression" rows="5" required></textarea></div>
          <details><summary data-i18n="fullText"></summary><div id="r-text" class="evidence textbox"></div></details>
          <label class="check"><input type="checkbox" id="r-confirm"> <span data-i18n="confirm"></span></label>
          <div><button class="primary" type="submit" data-i18n="fileReport"></button></div>
        </form>
        <div id="report-result" class="result"></div>
      </section>

      <section class="card pane" aria-labelledby="h-dicom">
        <h2 id="h-dicom" data-i18n="dicomTitle"></h2>
        <p class="sub" data-i18n="dicomHelp"></p>
        <form id="dicom-form" class="stack">
          <div class="row2">
            <div><label for="dicom-file" data-i18n="dicomFile"></label><input id="dicom-file" type="file" accept=".dcm,application/dicom,*/*" required></div>
            <div><label for="expected" data-i18n="expected"></label>
              <select id="expected"><option value="">—</option><option>CR</option><option>DX</option><option>CT</option><option>MR</option><option>US</option><option>MG</option><option>PT</option></select></div>
          </div>
          <div><button class="primary" type="submit" data-i18n="analyze"></button></div>
        </form>
        <div id="dicom-result" class="result"></div>
      </section>
    </div>

    <section class="card pane" aria-labelledby="h-ct" style="margin-top:16px;">
      <h2 id="h-ct" data-i18n="ctTitle"></h2>
      <p class="sub" data-i18n="ctHelp"></p>
      <form id="ct-form" class="row2" style="align-items:end;">
        <div><label for="ct-file" data-i18n="ctFile"></label><input id="ct-file" type="file" accept=".zip,.nii,.gz,application/zip" required></div>
        <div><button class="primary" type="submit" data-i18n="measure"></button></div>
      </form>
      <div id="ct-result" class="result"></div>
    </section>
    <p class="sub" style="margin-top:12px;"><a href="patient.html" data-i18n="graphLink"></a></p>
  </div>

  <footer data-i18n="footer"></footer>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const T = {
    ko: {
      title: '영상·외부 판독지', subtitle: '외부 병원 판독지를 읽고, DICOM 영상을 확인하며, 영상 AI 소견을 판독문과 대조합니다.',
      worklist: '작업 목록 →', api: 'ClinLoop API', token: '접근 토큰', signin: '로그인', patient: '환자 ID',
      disclaimer: '영상 AI는 보조 판독(second reader)일 뿐 진단이 아닙니다. AI 소견은 판독문에 없을 때 영상의학과 재검토 요청만 만들며, 환자에게 전달되지 않습니다. 연구용 모델의 결과는 병원이 허용하기 전에는 루프를 만들지 않습니다.',
      reportTitle: '외부 병원 판독지', reportHelp: 'PDF(텍스트) 또는 스캔본·사진(OCR, 한국어/영어)을 읽습니다. 추출된 검사명·날짜·결론을 원본과 확인·수정한 뒤 등록하세요. 파일은 저장되지 않고, 식별정보를 지운 결론과 파일 해시만 저장됩니다.',
      reportFile: '판독지 파일 (PDF, PNG, JPG, TIFF)', extract: '텍스트 추출', studyTitle: '검사명', reportDate: '검사일', impression: '결론 (Impression)',
      fullText: '추출된 전체 텍스트 (식별정보 제거)', confirm: '원본 문서와 대조하여 검사명·날짜·결론을 확인했습니다', fileReport: '판독지 등록 및 재평가',
      extracted: (m, c, p) => `${m === 'ocr' ? 'OCR' : 'PDF 텍스트'} · ${p}쪽` + (c != null ? ` · 인식 신뢰도 ${c}%` : '') + (m === 'ocr' && c != null && c < 85 ? ' · 신뢰도가 낮습니다: 특히 숫자와 단위를 확인하세요' : ''),
      dicomTitle: 'DICOM 영상 분석', dicomHelp: 'X선·CT·MRI·초음파 DICOM 파일 1개. 헤더 안전 점검(환자 불일치, 스크린샷, 부위 누락), 검사 기록, 병원이 활성화한 영상 모델을 실행합니다. 화소 데이터는 저장되지 않습니다.',
      dicomFile: 'DICOM 파일 (.dcm)', expected: '예상 검사 종류 (선택)', analyze: '분석',
      services: (m) => `DICOM: ${m.dicom_reader} · OCR: ${m.ocr} · 영상 모델 ${m.models.length}개`,
      header: '헤더', qa: '안전 점검', qaOk: '이상 없음', models: '영상 모델', noModels: '활성화된 영상 모델이 없습니다 (CLINLOOP_IMAGING_MODELS).',
      notRun: (r) => `실행 안 함: ${r}`, research: '연구용 · 의료기기 아님', approved: '규제 상태', positive: '양성', threshold: (t) => `기준 ${t}`,
      filed: '환자 기록에 등록했습니다.', refused: '등록하지 않았습니다: 위의 위급 점검 항목을 확인하세요.',
      loops: (n) => `재평가 결과 진행 중 루프 ${n}건`, noLoops: '진행 중 루프 없음', open: '작업 목록에서 보기',
      kv: { modality: '검사 종류', body_part: '부위', regions: '포함 부위', study_description: '검사 설명', study_date: '검사일', view_position: '촬영 방향', image_type: '영상 유형', manufacturer: '제조사', rows: '해상도' },
      ctTitle: 'CT 장기 측정 (3차원)', ctHelp: 'CT 시리즈 1개(DICOM 파일들을 묶은 .zip, 또는 NIfTI). TotalSegmentator(연구용)가 장기를 분할하고, ClinLoop이 대동맥 최대 단축 직경과 비장 길이를 근거 있는 기준으로 측정합니다. 이상 측정값은 판독문에 없을 때 영상의학과 재검토 요청만 만듭니다. NIfTI는 환자 ID가 없어 등록되지 않습니다.',
      ctFile: 'CT 시리즈 (.zip 또는 .nii.gz)', measure: '측정', organ: '장기', volume: '부피 (ml)', length: '두미 길이 (cm)', complete: '전체 포함', cutOff: '잘림',
      aorta: (m) => `대동맥 최대 단축 직경: 복부 ${m.abdominal_max_cm ?? '–'} cm (기준 3.0) · 흉부 ${m.thoracic_max_cm ?? '–'} cm (기준 4.0) · 정밀도 ±${m.precision_cm} cm`,
      spleen: (m) => `비장 두미 길이 ${m.craniocaudal_cm} cm (기준 13)${m.complete ? '' : ' · 스캔 범위 밖으로 잘림: 크기 판정 안 함'}`,
      ctFindings: '측정 소견 (재검토 요청)', noCtFindings: '기준을 넘는 측정값 없음', borderline: '경계값', covered: (r) => `스캔에 포함된 부위: ${r.join(', ')} (정보 제공용, 루프를 닫지 않음)`,
      vlmText: 'AI 생성 설명 (검증되지 않음, 저장되지 않음)', dropped: (n) => `어휘 밖이거나 부위가 맞지 않아 제외한 응답 ${n}개`, unparsed: '모델 응답을 해석할 수 없어 소견을 등록하지 않았습니다.',
      graphLink: '환자 지식 그래프 보기 →',
      scanTitle: 'PACS 자동 영상 분석', scanRun: '지금 실행',
      scanHelp: '새 검사를 PACS에서 찾아, 승인된 영상 AI 제품이 적용되는 검사만 자동으로 분석합니다. 환자는 MRN이 정확히 한 명과 일치할 때만 연결하며, 영상마다 환자 ID를 확인합니다. 화소 데이터는 저장되지 않습니다. 판독문이 AI 소견을 다루지 않으면 영상의학과 재검토 요청(R047)이 생깁니다.',
      scanOff: '꺼짐: 병원이 CLINLOOP_IMAGE_SCAN=1과 PACS(CLINLOOP_PACS_DICOMWEB)를 설정해야 켜집니다.',
      scanNoPacs: 'PACS가 설정되지 않았습니다 (CLINLOOP_PACS_DICOMWEB).',
      scanState: { OK: '정상 실행 중', STALE: '최근 실행 없음', FAILING: '연속 실패', NEVER: '아직 실행 안 됨' },
      scanEvery: (m, mods, d) => `${m}분마다 · ${mods.join(', ')} · 최근 ${d}일 검사`,
      scanLast: (ts, h) => `마지막 성공 ${ts} (${h}시간 전)`,
      scanModels: '자동 실행 모델', scanNoModels: '자동으로 실행할 수 있는 승인 모델이 없습니다.', scanSeries: '시리즈 전체', scanImage: '영상별',
      scanNotRun: '자동 실행 제외', scanCounts: '검사 처리 현황',
      scanStatusName: { scanned: '분석함', no_model: '적용 모델 없음', unmatched: '환자 불일치', refused: '안전 점검 거부', failed: '실패(재시도)' },
      scanProblems: '확인이 필요한 검사', scanResult: (r) => r.ok ? `발견 ${r.found} · 분석 ${r.scanned} · 소견 ${r.findings} · 대기 ${r.waiting}` : `실패: ${r.error}`,
      needPatient: '환자 ID를 입력하세요.', working: '처리 중…', footer: 'ClinLoop AI · AI는 다시 보도록 요청할 뿐, 판단은 영상의학과 전문의가 합니다.',
    },
    en: {
      title: 'Imaging & outside reports', subtitle: 'Read reports from other hospitals, check DICOM images, and compare imaging-AI findings with the report.',
      worklist: 'Worklist →', api: 'ClinLoop API', token: 'Access token', signin: 'Sign in', patient: 'Patient ID',
      disclaimer: 'Imaging AI is a second reader, never a diagnosis. An AI finding the report does not address only asks a radiologist to look again; it never reaches the patient. Findings from research-use models open no loops unless the hospital allows it.',
      reportTitle: 'Report from another hospital', reportHelp: 'Reads a PDF (text) or a scan/photo (OCR, Korean and English). Check and correct the extracted title, date and impression against the original, then file it. The file is not stored: only the impression (identifiers removed) and the file hash.',
      reportFile: 'Report file (PDF, PNG, JPG, TIFF)', extract: 'Extract text', studyTitle: 'Study', reportDate: 'Report date', impression: 'Impression',
      fullText: 'Full extracted text (identifiers removed)', confirm: 'I checked the study, date and impression against the original document', fileReport: 'File report and re-evaluate',
      extracted: (m, c, p) => `${m === 'ocr' ? 'OCR' : 'PDF text'} · ${p} page(s)` + (c != null ? ` · recognition confidence ${c}%` : '') + (m === 'ocr' && c != null && c < 85 ? ' · low confidence: check numbers and units carefully' : ''),
      dicomTitle: 'DICOM image analysis', dicomHelp: 'One X-ray, CT, MRI or ultrasound DICOM file. Header safety checks (wrong patient, screenshot, missing body part), the study record, and the imaging models the hospital has enabled. Pixel data is never stored.',
      dicomFile: 'DICOM file (.dcm)', expected: 'Expected modality (optional)', analyze: 'Analyze',
      services: (m) => `DICOM: ${m.dicom_reader} · OCR: ${m.ocr} · ${m.models.length} imaging model(s)`,
      header: 'Header', qa: 'Safety checks', qaOk: 'No problems found', models: 'Imaging models', noModels: 'No imaging models are enabled (CLINLOOP_IMAGING_MODELS).',
      notRun: (r) => `Not run: ${r}`, research: 'Research use · not a medical device', approved: 'Regulatory status', positive: 'positive', threshold: (t) => `threshold ${t}`,
      filed: 'Filed to the patient record.', refused: 'Not filed: see the critical check above.',
      loops: (n) => `After re-evaluation: ${n} active loop(s)`, noLoops: 'No active loops', open: 'Open the worklist',
      kv: { modality: 'Modality', body_part: 'Body part', regions: 'Regions covered', study_description: 'Description', study_date: 'Study date', view_position: 'View', image_type: 'Image type', manufacturer: 'Manufacturer', rows: 'Matrix' },
      ctTitle: 'CT organ measurement (3-D)', ctHelp: 'One CT series (a .zip of its DICOM files, or NIfTI). TotalSegmentator (research use) segments the organs; ClinLoop measures the aorta\'s maximum short-axis diameter and the spleen\'s length against cited thresholds. An abnormal measurement the report does not address only asks a radiologist to look again. NIfTI has no patient ID, so it is never filed.',
      ctFile: 'CT series (.zip or .nii.gz)', measure: 'Measure', organ: 'Organ', volume: 'Volume (ml)', length: 'Craniocaudal (cm)', complete: 'Fully in scan', cutOff: 'cut off',
      aorta: (m) => `Aorta, maximum short-axis diameter: abdominal ${m.abdominal_max_cm ?? '–'} cm (limit 3.0) · thoracic ${m.thoracic_max_cm ?? '–'} cm (limit 4.0) · precision ±${m.precision_cm} cm`,
      spleen: (m) => `Spleen craniocaudal length ${m.craniocaudal_cm} cm (limit 13)${m.complete ? '' : ' · cut off by the scan: not sized'}`,
      ctFindings: 'Measurement findings (review requests)', noCtFindings: 'No measurement above its limit', borderline: 'borderline', covered: (r) => `Regions in the scan: ${r.join(', ')} (information only: closes no loop)`,
      vlmText: 'AI-generated description (unverified, not stored)', dropped: (n) => `${n} answer(s) dropped: outside the vocabulary or the wrong body region`, unparsed: 'The model\'s answer could not be read: no findings were filed.',
      graphLink: 'Open the patient knowledge graph →',
      scanTitle: 'Automatic scanning from the PACS', scanRun: 'Run now',
      scanHelp: 'Finds new studies in the PACS and analyses only those an approved imaging-AI product applies to. A study is linked to a patient only when its MRN matches exactly one patient, and every image\'s patient ID is checked. Pixel data is never stored. A finding the report does not address asks a radiologist to look again (R047).',
      scanOff: 'Off: the hospital turns it on with CLINLOOP_IMAGE_SCAN=1 and a PACS (CLINLOOP_PACS_DICOMWEB).',
      scanNoPacs: 'No PACS configured (CLINLOOP_PACS_DICOMWEB).',
      scanState: { OK: 'Running', STALE: 'No recent run', FAILING: 'Failing', NEVER: 'Not run yet' },
      scanEvery: (m, mods, d) => `Every ${m} min · ${mods.join(', ')} · studies from the last ${d} day(s)`,
      scanLast: (ts, h) => `Last success ${ts} (${h} h ago)`,
      scanModels: 'Models that run automatically', scanNoModels: 'No approved model can run automatically.', scanSeries: 'whole series', scanImage: 'per image',
      scanNotRun: 'Not run automatically', scanCounts: 'Studies so far',
      scanStatusName: { scanned: 'analysed', no_model: 'no model applies', unmatched: 'patient not matched', refused: 'refused by safety check', failed: 'failed (will retry)' },
      scanProblems: 'Studies that need a person', scanResult: (r) => r.ok ? `found ${r.found} · analysed ${r.scanned} · findings ${r.findings} · waiting ${r.waiting}` : `Failed: ${r.error}`,
      needPatient: 'Enter a patient ID.', working: 'Working…', footer: 'ClinLoop AI · The AI asks for a second look; the radiologist decides.',
    },
  };
  const store = { get(k, s = sessionStorage) { try { return s.getItem(k) || ''; } catch { return ''; } },
                  set(k, v, s = sessionStorage) { try { s.setItem(k, v); } catch {} } };
  let lang = store.get('clinloop_lang', localStorage) || ((navigator.language || '').startsWith('ko') ? 'ko' : 'en');
  const t = () => T[lang];
  const state = { base: '', token: '', user: null, models: null, file: null, sha: null };
  const isLocal = ['localhost', '127.0.0.1'].includes(location.hostname);
  $('api-base').value = store.get('clinloop_api') || window.CLINLOOP_API_BASE || (isLocal ? 'http://localhost:8124' : '');
  $('token').value = store.get('clinloop_token');

  function applyLang() {
    document.documentElement.lang = lang;
    $('btn-lang').textContent = lang === 'ko' ? 'English' : '한국어';
    document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t()[el.dataset.i18n]; });
    if (state.models) $('services').textContent = t().services(state.models);
    if (state.scan) $('scan-status').innerHTML = scanHtml(state.scan);
  }
  function setStatus(msg, isError = false) { $('status').textContent = msg; $('status').classList.toggle('error', isError); }
  async function api(path, opts = {}) {
    const res = await fetch(state.base + path, { ...opts, headers: { 'Authorization': `Bearer ${state.token}`, 'Content-Type': 'application/json', ...(opts.headers || {}) } });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.detail || `HTTP ${res.status}`);
    return body;
  }
  const readB64 = (file) => new Promise((resolve, reject) => {
    const r = new FileReader(); r.onload = () => resolve(String(r.result).split(',')[1]); r.onerror = reject; r.readAsDataURL(file);
  });
  const patient = () => { const p = $('patient').value.trim(); if (!p) throw new Error(t().needPatient); return p; };

  function loopsHtml(active) {
    if (!active) return '';
    return `<p class="sub" style="margin-top:8px;"><b>${esc(active.length ? t().loops(active.length) : t().noLoops)}</b></p>` +
      (active.length ? `<ul class="sub">${active.map((a) => `<li>${esc(a.rule_id)} · ${esc(a.rule_name)} · ${esc(a.status)}</li>`).join('')}</ul>
       <a href="worklist.html">${esc(t().open)}</a>` : '');
  }

  // ── Outside report ──
  $('report-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
      const file = $('report-file').files[0];
      const pid = patient();
      setStatus(t().working);
      state.file = { name: file.name, b64: await readB64(file) };
      const r = await api('/api/v1/documents/outside-report/extract', { method: 'POST', body: JSON.stringify({ patient_id: pid, filename: file.name, content_base64: state.file.b64 }) });
      $('extract-meta').textContent = t().extracted(r.method, r.confidence, r.pages);
      $('r-title').value = r.parsed.title || '';
      $('r-date').value = r.parsed.date || '';
      $('r-impression').value = r.parsed.conclusion || '';
      $('r-text').textContent = r.text;
      $('r-confirm').checked = false;
      $('file-form').hidden = false;
      $('report-result').innerHTML = '';
      setStatus('');
    } catch (err) { setStatus(err.message, true); }
  });
  $('file-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
      setStatus(t().working);
      const r = await api('/api/v1/documents/outside-report', { method: 'POST', body: JSON.stringify({
        patient_id: patient(), filename: state.file.name, content_base64: state.file.b64,
        title: $('r-title').value, date: $('r-date').value || null, conclusion: $('r-impression').value, confirmed: $('r-confirm').checked }) });
      $('report-result').innerHTML = `<div class="qa" style="background:var(--ok-soft);">${esc(t().filed)}</div>` + loopsHtml(r.active);
      setStatus('');
    } catch (err) { setStatus(err.message, true); }
  });

  // ── DICOM ──
  function modelHtml(m) {
    const badge = m.research_use ? `<span class="chip moderate">${esc(t().research)}</span>` : `<span class="chip ok">${esc(m.regulatory)}</span>`;
    const head = `<div class="loop-head"><b class="loop-title">${esc(m.name)} ${esc(m.version || '')}</b>${badge}</div>`;
    if (!m.ran) return `<div class="model">${head}<p class="sub">${esc(t().notRun(m.reason))}</p></div>`;
    const rows = m.findings.map((f) => {
      const s = typeof f.score === 'number' ? f.score : null;
      return `<tr><td>${esc(f.label)}${f.positive ? ` <span class="chip critical">${esc(t().positive)}</span>` : ''}</td>
        <td><div class="bar"><span class="${f.positive ? 'pos' : ''}" style="width:${s == null ? 0 : Math.round(s * 100)}%"></span></div></td>
        <td class="num">${s == null ? '–' : s.toFixed(2)}</td></tr>`;
    }).join('');
    const vlm = m.description_note !== undefined ? `
      ${m.description ? `<p class="sub" style="margin:6px 0 2px;"><b>${esc(t().vlmText)}</b></p><div class="evidence">${esc(m.description)}</div>` : ''}
      ${m.unparsed ? `<div class="qa warning">${esc(t().unparsed)}</div>` : ''}
      ${(m.dropped || []).length ? `<p class="sub">${esc(t().dropped(m.dropped.length))}</p>` : ''}` : '';
    return `<div class="model">${head}<p class="sub" style="margin:4px 0;">${esc(m.intended_use || '')}${m.threshold != null ? ` · ${esc(t().threshold(m.threshold))}` : ''}</p>
      <table class="find-table"><tbody>${rows}</tbody></table>${vlm}</div>`;
  }
  $('dicom-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
      const file = $('dicom-file').files[0];
      const pid = patient();
      setStatus(t().working);
      const r = await api('/api/v1/imaging/analyze', { method: 'POST', body: JSON.stringify({
        patient_id: pid, filename: file.name, content_base64: await readB64(file), expected_modality: $('expected').value || null }) });
      const s = r.summary;
      const kv = Object.entries(t().kv).map(([k, label]) => {
        let v = s[k];
        if (k === 'rows') v = s.rows ? `${s.rows} × ${s.columns}${s.frames > 1 ? ` × ${s.frames}` : ''}` : '';
        if (Array.isArray(v)) v = v.join(', ');
        return v ? `<dt>${esc(label)}</dt><dd>${esc(v)}</dd>` : '';
      }).join('');
      const qa = r.qa.length ? r.qa.map((q) => `<div class="qa ${esc(q.level)}">${esc(q.message)}</div>`).join('') : `<div class="qa" style="background:var(--ok-soft);">${esc(t().qaOk)}</div>`;
      $('dicom-result').innerHTML = `
        ${r.preview ? `<img class="preview" alt="DICOM preview" src="${esc(r.preview)}">` : ''}
        <h3 class="sub" style="margin:10px 0 4px;"><b>${esc(t().header)}</b></h3><dl class="kv">${kv}</dl>
        <h3 class="sub" style="margin:10px 0 4px;"><b>${esc(t().qa)}</b></h3>${qa}
        <h3 class="sub" style="margin:10px 0 4px;"><b>${esc(t().models)}</b></h3>${r.models.length ? r.models.map(modelHtml).join('') : `<p class="sub">${esc(t().noModels)}</p>`}
        <div class="qa" style="margin-top:10px;background:${r.filed ? 'var(--ok-soft)' : 'var(--critical)'};${r.filed ? '' : 'color:#fff;'}">${esc(r.filed ? t().filed : t().refused)}</div>
        ${loopsHtml(r.active)}`;
      setStatus('');
    } catch (err) { setStatus(err.message, true); }
  });

  // ── Automatic scanning ──
  function scanHtml(s) {
    if (!s) return '';
    if (!s.enabled) return `<div class="qa">${esc(t().scanOff)}</div>`;
    if (!s.pacs_configured) return `<div class="qa warning">${esc(t().scanNoPacs)}</div>`;
    const level = { OK: 'ok', STALE: 'moderate', FAILING: 'critical', NEVER: 'moderate' }[s.status] || 'moderate';
    const models = s.models.length ? `<ul class="sub">${s.models.map((m) => `<li>${esc(m.name)} · ${esc(m.regulatory)} · ${esc(m.input === 'series' ? t().scanSeries : t().scanImage)} · ${esc((m.modalities || []).join('/'))}</li>`).join('')}</ul>`
      : `<div class="qa warning">${esc(t().scanNoModels)}</div>`;
    const notRun = (s.models_not_run || []).length ? `<p class="sub"><b>${esc(t().scanNotRun)}</b></p><ul class="sub">${s.models_not_run.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : '';
    const counts = Object.entries(s.studies || {}).map(([k, n]) => `${esc(t().scanStatusName[k] || k)} ${n}`).join(' · ');
    const problems = (s.problems || []).length ? `<p class="sub"><b>${esc(t().scanProblems)}</b></p>` +
      s.problems.map((p) => `<div class="qa ${p.status === 'failed' ? 'warning' : ''}"><b>${esc(t().scanStatusName[p.status] || p.status)}</b> · ${esc(p.detail)} <span class="sub">(${esc(p.study_uid)})</span></div>`).join('') : '';
    return `<div class="loop-head"><span class="chip ${level}">${esc(t().scanState[s.status] || s.status)}</span>
        <span class="sub">${esc(t().scanEvery(s.interval_minutes, s.modalities, s.lookback_days))}</span></div>
      ${s.last_success ? `<p class="sub">${esc(t().scanLast(s.last_success.slice(0, 16).replace('T', ' '), s.hours_since_success))}</p>` : ''}
      <p class="sub" style="margin-top:8px;"><b>${esc(t().scanModels)}</b></p>${models}${notRun}
      ${counts ? `<p class="sub"><b>${esc(t().scanCounts)}</b>: ${counts}</p>` : ''}${problems}`;
  }
  async function loadScan() {
    try { state.scan = await api('/api/v1/imaging/scan/status'); } catch (err) { state.scan = null; $('scan-status').textContent = err.message; return; }
    $('scan-status').innerHTML = scanHtml(state.scan);
    $('scan-run').hidden = !(state.user && state.user.role === 'admin' && state.scan.enabled && state.scan.pacs_configured);
  }
  $('scan-run').addEventListener('click', async () => {
    try {
      setStatus(t().working);
      const r = await api('/api/v1/imaging/scan/run', { method: 'POST' });
      setStatus(t().scanResult(r), !r.ok);
      await loadScan();
    } catch (err) { setStatus(err.message, true); }
  });

  // ── CT series ──
  $('ct-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
      const file = $('ct-file').files[0];
      const pid = patient();
      setStatus(t().working);
      const r = await api('/api/v1/imaging/ct-organs', { method: 'POST', body: JSON.stringify({ patient_id: pid, filename: file.name, content_base64: await readB64(file) }) });
      const qa = r.qa.map((q) => `<div class="qa ${esc(q.level)}">${esc(q.message)}</div>`).join('');
      const ms = r.measurements || {};
      const organs = r.organs.map((o) => `<tr><td>${esc(o.organ.replace(/_/g, ' '))}</td><td class="num">${esc(o.volume_ml)}</td><td class="num">${esc(o.craniocaudal_cm)}</td><td>${o.complete ? '✓' : esc(t().cutOff)}</td></tr>`).join('');
      const finds = r.findings.length ? r.findings.map((f) => `<div class="qa warning"><b>${esc(f.label)}</b>${f.borderline ? ` <span class="chip moderate">${esc(t().borderline)}</span>` : ''}</div>`).join('')
        : `<div class="qa" style="background:var(--ok-soft);">${esc(t().noCtFindings)}</div>`;
      $('ct-result').innerHTML = `${modelHtml({ ...r.model, ran: true, findings: [] }).replace('<table class="find-table"><tbody></tbody></table>', '')}
        ${qa}
        <h3 class="sub" style="margin:10px 0 4px;"><b>${esc(t().ctFindings)}</b></h3>${finds}
        ${ms.aorta ? `<p class="sub" style="margin:8px 0 2px;">${esc(t().aorta(ms.aorta))}</p>` : ''}
        ${ms.spleen ? `<p class="sub" style="margin:2px 0;">${esc(t().spleen(ms.spleen))}</p>` : ''}
        <p class="sub" style="margin:2px 0 8px;">${esc(t().covered(r.covered_regions))}</p>
        <table class="find-table"><thead><tr><th>${esc(t().organ)}</th><th>${esc(t().volume)}</th><th>${esc(t().length)}</th><th>${esc(t().complete)}</th></tr></thead><tbody>${organs}</tbody></table>
        <div class="qa" style="margin-top:10px;background:${r.filed ? 'var(--ok-soft)' : 'var(--critical)'};${r.filed ? '' : 'color:#fff;'}">${esc(r.filed ? t().filed : t().refused)}</div>
        ${loopsHtml(r.active)}`;
      setStatus('');
    } catch (err) { setStatus(err.message, true); }
  });

  $('connect-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    state.base = $('api-base').value.replace(/\/+$/, '');
    state.token = $('token').value.trim();
    try {
      state.user = await api('/api/v1/me');
      state.models = await api('/api/v1/imaging/models');
      store.set('clinloop_api', state.base); store.set('clinloop_token', state.token);
      $('services').textContent = t().services(state.models);
      $('app').hidden = false;
      await loadScan();
      setStatus(`${state.user.user} (${state.user.role})`);
    } catch (err) { $('app').hidden = true; setStatus(err.message, true); }
  });
  $('btn-lang').addEventListener('click', () => { lang = lang === 'ko' ? 'en' : 'ko'; store.set('clinloop_lang', lang, localStorage); applyLang(); });
  applyLang();
})();
</script>
</body>
</html>
